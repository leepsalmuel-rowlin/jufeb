<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Elements Offline</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- Custom Styles & Animations -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        @keyframes fadeOutDown { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }
        .animate-fade-out-down { animation: fadeOutDown 0.3s forwards; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Board Exam Typography (Philippine ME Board Exam Simulation) */
        .board-exam-font {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: -0.01em;
        }
        .touch-card {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .tabular-nums { font-variant-numeric: tabular-nums; }

        /* Feature 2: Top 1 Impact Game-Style Feedback Animations */
        @keyframes top1FlashEmerald {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); background-color: rgba(236, 253, 245, 0.95); }
            100% { box-shadow: 0 0 0 18px rgba(16, 185, 129, 0); }
        }
        .top1-flash-emerald { animation: top1FlashEmerald 0.55s ease-out; }

        @keyframes top1ShimmerGold {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.75); border-color: #f59e0b; }
            45% { box-shadow: 0 0 28px 6px rgba(251, 191, 36, 0.65); border-color: #eab308; background-color: #fffbeb; }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .top1-shimmer-gold { animation: top1ShimmerGold 0.85s ease-out; }

        @keyframes top1MicroShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .top1-shake { animation: top1MicroShake 0.36s ease-in-out; }

        @keyframes top1VignetteCrimson {
            0% { opacity: 0; }
            25% { opacity: 1; }
            100% { opacity: 0; }
        }
        .top1-vignette-crimson {
            position: fixed; inset: 0; pointer-events: none; z-index: 60;
            box-shadow: inset 0 0 90px 18px rgba(220, 38, 38, 0.45);
            animation: top1VignetteCrimson 0.65s ease-out forwards;
        }

        @keyframes top1FloatDelta {
            0% { opacity: 0; transform: translate(-50%, 12px) scale(0.85); }
            20% { opacity: 1; transform: translate(-50%, -6px) scale(1.06); }
            80% { opacity: 1; transform: translate(-50%, -26px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -42px) scale(0.95); }
        }
        .top1-float-delta {
            position: fixed; top: 82px; left: 50%; z-index: 70; pointer-events: none;
            animation: top1FloatDelta 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes top1AmberSlide {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .top1-amber-slide { animation: top1AmberSlide 0.28s ease-out; }

        @keyframes objSideSlideIn {
            0% { opacity: 0; transform: translateX(36px) scale(0.92); }
            14% { opacity: 1; transform: translateX(0) scale(1.03); }
            24% { opacity: 1; transform: translateX(0) scale(1); }
            82% { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(26px) scale(0.95); }
        }
        .obj-side-popup {
            animation: objSideSlideIn 2.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .obj-side-popup-long {
            animation: objSideSlideIn 2.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes overdriveShimmer {
            0%, 100% { box-shadow: 0 0 0 1px rgba(245,158,11,0.45), 0 4px 14px -2px rgba(245,158,11,0.28); }
            50% { box-shadow: 0 0 0 2px rgba(234,179,8,0.85), 0 6px 20px -2px rgba(234,179,8,0.45); }
        }
        .overdrive-card-glow { animation: overdriveShimmer 2.6s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-200">

    <div id="app" class="flex-1 flex flex-col">
        <!-- Content will be rendered here by JavaScript -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONSTANTS ---
        const INTERVALS = { 1: 1, 2: 3, 3: 7, 4: 15, 5: 30, 6: 60 };
        const MS_PER_DAY = 24 * 60 * 60 * 1000;
        const MELE_EXAM_DATE_MS = new Date('2027-02-15T00:00:00').getTime();
        const MELE_POST_EXAM_MS = new Date('2027-02-28T23:59:59').getTime();

        const generateId = () => {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        };

        const mySessionId = generateId(); 
        let timerInterval = null;
        let etaRefreshInterval = null;
        let sessionCardDurations = []; // Rolling window of recent card durations (seconds)
        let currentCardStartTs = 0;
        let lastFeedbackAnim = null; // { type: 'emerald'|'gold'|'miss'|'crit_miss'|'rushed', ts }
        
        // --- STATE ---
        let state = {
            isLoaded: false,
            folders: [],
            terms: [],
            history: {}, 
            activityLog: {}, // Compact hourly activity buckets: { "YYYY-MM-DD": { "0".."23": { c, w, s } } }
            dailyTelemetry: {}, // Local-only daily telemetry (micro-wins, pace brackets, clean blocks, orders)
            orderThrottle: { masteryScale: 1.0, leechScale: 1.0, sharpnessScale: 1.0, consecutiveAllClear: 0, missedStreak: { mastery: 0, leech: 0, sharpness: 0 }, lastEvaluatedDate: null },
            topnotcherScope: 'full', // 'prime' | 'full'
            topnotcherDisplayUnit: 'pct', // 'pct' (%) | 'rp' (RP)
            intakeRateMode: 'auto', // 'auto' (history-detected) | 'custom' (user-set cards/day)
            customIntakeRate: 10, // cards/day when intakeRateMode === 'custom'
            hudStakesMode: 'stakes', // 'stakes' (Pre-Answer Stakes) | 'clean' (Clean Exam / Post-Reveal Only)
            queueMode: 'smart', // 'smart' (Warm-Up + Interleaved Leeches) | 'random'
            weeklyTargets: { 0: 120, 1: 80, 2: 80, 3: 80, 4: 80, 5: 80, 6: 50 }, // Sun(0)..Sat(6) adaptive daily targets
            showWeeklyTargetEditor: false,
            showYesterdayOrders: false,
            sessionLastImpact: null, // { delta, dodgedOrMissed, type, isRushed, label, cardId }
            sessionSummaryModal: null, // Shown after Leech Surgery or completed session
            currentView: 'dashboard',
            sessionData: null,
            currentCardIndex: 0,
            showAnswer: false,
            revealStep: 0, // 0: chunk2 blurred, 1: full stem visible, 2: all choices visible
            revealedChoicesCount: 0, // Number of choices unblurred one-by-one (0 -> 1(A) -> 2(B) -> 3(C) -> 4(D))
            selectedChoice: null,
            currentShuffledChoices: null,
            showKeywordsExp: false,
            isEditingExplanation: false,
            showTaglishSimplified: false,
            isEditingTaglish: false,
            ttsState: 'idle', // 'idle' | 'preparing' | 'speaking'
            ttsEngine: 'browser', // 'browser' (Free Unlimited) | 'gcloud' (1M-4M free/mo) | 'azure' (500k free/mo)
            ttsVoiceName: 'auto', // Selected browser voice name or cloud voice ID
            ttsRate: 1.05, // Speaking speed (0.85 - 1.6)
            ttsUseAiPolish: true, // AI converts formulas/numbers to clean spoken script & caches per card
            ttsCloudApiKey: '', // Optional Google Cloud TTS API key or Azure Speech Key
            ttsAzureRegion: 'southeastasia', // Azure Speech region (default Southeast Asia / PH-closest)
            showEtaPredictor: true, // One-tap toggleable finish-time clock predictor during session
            timerEnabled: true,
            timeLeft: 10,
            timePerCard: 10, 
            lookAheadDays: 2,
            intakeSize: 20,
            activeFolderId: 'mdsp',
            studyFolderId: 'all',
            statsFolderId: 'all', 
            analyticsFolderId: 'all',
            analyticsHeatmapRange: 'this_week', // 'today' | 'this_week' | 'last_week' | 'all'
            analyticsSelectedSlot: null, // Selected cell key for tap inspection on phone
            showBulk: false,
            editingFolderId: null,
            addingSubfolderTo: null,
            movingFolderId: null,
            editingTermId: null, 
            sessionConflict: false, 
            selectedTerms: [], 
            expandedFolders: [], // File Explorer open folder IDs (collapsed by default)
            hideFolderSidebar: false, // Toggleable File Explorer panel visibility
            parkingLotFilter: false, // View/filter Parking Lot cards
            erroneousFilter: false, // View/filter Erroneous Tracker cards
            geminiApiKey: '', // Synced per-account via Firebase Vault & localStorage (never hardcoded in GitHub)
            geminiModel: 'auto', // Active AI model ('auto' discovers & locks onto 500 RPD Flash-Lite / 14.4k RPD Gemma)
            showApiKeyModal: false,
            forecastMode: 'actual', 
            forecastQuota: 50,
            forecastExtra: 0,
            forecastFolderId: 'all',
            forecastRatio: 0.5,
            forecastPhase1EndDate: '2026-12-31', 
            forecastPhase2Ratio: 1.0, 
            actualForecastData: null,
            simulatedForecastData: null,
            forecastStartDate: null
        };

        window.setTimePerCard = (val) => {
            let newVal = parseInt(val);
            if(newVal && newVal > 0) {
                state.timePerCard = newVal;
                if(state.currentView === 'session' && state.timeLeft > state.timePerCard) {
                     state.timeLeft = state.timePerCard;
                }
                renderApp();
            }
        };

        // --- HELPER FUNCTIONS ---
        const getTodayStart = () => {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d.getTime();
        };

        const getFolderFullPath = (id, list) => {
            let current = list.find(f => f.id === id);
            if (!current) return 'Unknown';
            let path = current.name;
            while (current && current.parentId) {
                current = list.find(f => f.id === current.parentId);
                if (current) path = current.name + ' / ' + path;
            }
            return path;
        };

        const getStudyFolderIds = () => {
            if (state.studyFolderId === 'all') return null;
            let ids = [state.studyFolderId];
            let i = 0;
            while (i < ids.length) {
                let children = state.folders.filter(f => f.parentId === ids[i]).map(f => f.id);
                ids = ids.concat(children);
                i++;
            }
            return ids;
        };

        const shuffleArray = (array) => {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        };

        window.showToast = (msg, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 right-6 px-6 py-3 rounded-2xl text-white font-bold shadow-xl slide-up z-50 flex items-center gap-2 ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'}`;
            toast.innerHTML = `<i class="ph-fill ${type === 'success' ? 'ph-check-circle' : 'ph-x-circle'} text-xl"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('animate-fade-out-down');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // --- DATA MANAGEMENT & CLOUD SYNC ---
        function ensureValidActiveFolder() {
            if (state.folders.length > 0 && !state.folders.some(f => f.id === state.activeFolderId)) {
                const folderWithCards = state.folders.find(f => state.terms.some(t => t.folderId === f.id));
                state.activeFolderId = folderWithCards ? folderWithCards.id : state.folders[0].id;
            }
        }

        function cleanTermsForStorage(terms) {
            return (terms || []).map(t => {
                const copy = { ...t };
                delete copy.isGeneratingAI;
                delete copy.isAppendingAI;
                delete copy.isGeneratingTaglish;
                delete copy.isGeneratingDerivation;
                delete copy.isGeneratingSimplify;
                delete copy.isSplittingStem;
                return copy;
            });
        }

        function loadData() {
            const savedFolders = localStorage.getItem('elementVaultFolders');
            const savedTerms = localStorage.getItem('elementVaultTerms');
            const savedHistory = localStorage.getItem('elementVaultHistory');
            const savedActivityLog = localStorage.getItem('elementVaultActivityLog');
            const savedSimForecast = localStorage.getItem('elementVaultSimForecast');
            const savedApiKey = localStorage.getItem('elementVaultGeminiKey');
            const savedModel = localStorage.getItem('elementVaultGeminiModel');
            const savedShowEta = localStorage.getItem('elementVaultShowEta');
            const savedTtsConfig = localStorage.getItem('elementVaultTtsConfig');
            const savedTopPrefs = localStorage.getItem('elementVaultTopnotcherPrefs');
            const savedDailyTel = localStorage.getItem('elementVaultDailyTelemetry');
            const savedThrottle = localStorage.getItem('elementVaultOrderThrottle');
            
            if (savedFolders) state.folders = JSON.parse(savedFolders);
            if (savedHistory) state.history = JSON.parse(savedHistory);
            if (savedActivityLog) {
                try { state.activityLog = JSON.parse(savedActivityLog) || {}; } catch (e) { state.activityLog = {}; }
            }
            if (savedTopPrefs) {
                try {
                    const tp = JSON.parse(savedTopPrefs);
                    if (tp.topnotcherScope) state.topnotcherScope = tp.topnotcherScope;
                    if (tp.topnotcherDisplayUnit) state.topnotcherDisplayUnit = tp.topnotcherDisplayUnit;
                    if (tp.intakeRateMode) state.intakeRateMode = tp.intakeRateMode;
                    if (typeof tp.customIntakeRate === 'number' && !isNaN(tp.customIntakeRate)) state.customIntakeRate = tp.customIntakeRate;
                    if (tp.hudStakesMode) state.hudStakesMode = tp.hudStakesMode;
                    if (tp.queueMode) state.queueMode = tp.queueMode;
                    if (tp.weeklyTargets && typeof tp.weeklyTargets === 'object') {
                        state.weeklyTargets = { ...state.weeklyTargets, ...tp.weeklyTargets };
                    }
                } catch (e) {}
            }
            if (savedDailyTel) {
                try { state.dailyTelemetry = JSON.parse(savedDailyTel) || {}; } catch (e) { state.dailyTelemetry = {}; }
            }
            if (savedThrottle) {
                try {
                    const th = JSON.parse(savedThrottle);
                    state.orderThrottle = {
                        ...state.orderThrottle,
                        ...th,
                        missedStreak: { ...state.orderThrottle.missedStreak, ...(th.missedStreak || {}) }
                    };
                } catch (e) {}
            }
            if (savedApiKey) state.geminiApiKey = savedApiKey;
            if (savedShowEta !== null) state.showEtaPredictor = savedShowEta !== 'false';
            if (savedTtsConfig) {
                try {
                    const tc = JSON.parse(savedTtsConfig);
                    if (tc.ttsEngine) state.ttsEngine = tc.ttsEngine;
                    if (tc.ttsVoiceName) state.ttsVoiceName = tc.ttsVoiceName;
                    if (tc.ttsRate) state.ttsRate = Number(tc.ttsRate) || 1.05;
                    if (typeof tc.ttsUseAiPolish === 'boolean') state.ttsUseAiPolish = tc.ttsUseAiPolish;
                    if (typeof tc.ttsCloudApiKey === 'string') state.ttsCloudApiKey = tc.ttsCloudApiKey;
                    if (tc.ttsAzureRegion) state.ttsAzureRegion = tc.ttsAzureRegion;
                } catch (e) {}
            }
            if (savedModel && savedModel !== 'gemini-3-flash-preview') {
                state.geminiModel = savedModel;
            } else {
                state.geminiModel = 'auto';
            }
            if (savedSimForecast) {
                state.simulatedForecastData = JSON.parse(savedSimForecast);
                state.simulatedForecastData.forEach(d => d.date = new Date(d.date)); // Revive date objects
            }
            if (savedTerms) {
                state.terms = JSON.parse(savedTerms);
                
                const validFolderIds = new Set(state.folders.map(f => f.id));
                let needsSave = false;
                state.terms.forEach(t => {
                    if (!validFolderIds.has(t.folderId)) {
                        state.folders.push({ id: t.folderId, name: '⚠️ Recovered Cards', parentId: null });
                        validFolderIds.add(t.folderId);
                        needsSave = true;
                    }
                });
                if (needsSave) saveData();
            }
            ensureValidActiveFolder();
            state.isLoaded = true;
        }

        function saveData() {
            const cleanedTerms = cleanTermsForStorage(state.terms);
            localStorage.setItem('elementVaultFolders', JSON.stringify(state.folders));
            localStorage.setItem('elementVaultTerms', JSON.stringify(cleanedTerms));
            localStorage.setItem('elementVaultHistory', JSON.stringify(state.history));
            if (state.activityLog) {
                localStorage.setItem('elementVaultActivityLog', JSON.stringify(state.activityLog));
            }
            if (state.geminiApiKey !== undefined) {
                localStorage.setItem('elementVaultGeminiKey', state.geminiApiKey || '');
            }
            if (state.geminiModel) {
                localStorage.setItem('elementVaultGeminiModel', state.geminiModel);
            }
            saveLocalTelemetryOnly();
            
            if (window.saveToCloud) window.saveToCloud();
        }

        function saveLocalTelemetryOnly() {
            // Prune dailyTelemetry to last 45 days so localStorage stays super light (ZERO Firestore writes!)
            const keys = Object.keys(state.dailyTelemetry || {}).sort();
            if (keys.length > 45) {
                keys.slice(0, keys.length - 45).forEach(k => delete state.dailyTelemetry[k]);
            }
            localStorage.setItem('elementVaultTopnotcherPrefs', JSON.stringify({
                topnotcherScope: state.topnotcherScope,
                topnotcherDisplayUnit: state.topnotcherDisplayUnit,
                intakeRateMode: state.intakeRateMode,
                customIntakeRate: state.customIntakeRate,
                hudStakesMode: state.hudStakesMode,
                queueMode: state.queueMode,
                weeklyTargets: state.weeklyTargets
            }));
            localStorage.setItem('elementVaultDailyTelemetry', JSON.stringify(state.dailyTelemetry || {}));
            localStorage.setItem('elementVaultOrderThrottle', JSON.stringify(state.orderThrottle || {}));
        }

        const firebaseConfig = {
            apiKey: "AIzaSyA9SLRfYZUTLzzUpGqV0hAzGlDRQDKyBm8",
            authDomain: "flashcards-808e0.firebaseapp.com",
            projectId: "flashcards-808e0",
            storageBucket: "flashcards-808e0.firebasestorage.app",
            messagingSenderId: "633251772382",
            appId: "1:633251772382:web:94be56f70f14c176880f4f"
        };
        const appId = 'mechanical-elements';

        let db, auth, userId, sessionUnsubscribe;
        let isCloudSynced = false;
        const isFirebaseConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";

        if (isFirebaseConfigured) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            window.loginWithGoogle = () => {
                const provider = new GoogleAuthProvider();
                signInWithPopup(auth, provider).catch(error => {
                    console.error("Firebase Auth Error:", error);
                    if (error.code === 'auth/unauthorized-domain') {
                        showToast("Login Failed: Hindi pa naka-authorize ang Netlify link mo sa Firebase Console (Authorized Domains).", "error");
                    } else if (error.code === 'auth/operation-not-allowed') {
                        showToast("Login Failed: Hindi pa naka-ENABLE ang Google Sign-In sa Firebase Console mo.", "error");
                    } else {
                        showToast(`Login failed: ${error.message}`, "error");
                    }
                });
            };

            window.logout = () => {
                signOut(auth).then(() => {
                    userId = null;
                    state.isLoaded = false;
                    renderApp();
                });
            };

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    state.isLoaded = true;
                    enforceSingleSession(); 
                    setupCloudSync();
                } else {
                    userId = null;
                    state.isLoaded = true;
                    renderApp(); 
                }
            });
        } else {
            state.isLoaded = true;
            console.warn("⚠️ Firebase keys are missing! Running in Offline-Only Mode.");
            renderApp();
        }

        function enforceSingleSession() {
            if (!userId || !db) return;
            const sessionRef = doc(db, 'artifacts', appId, 'users', userId, 'appData', 'activeSession');
            
            setDoc(sessionRef, { sessionId: mySessionId, timestamp: Date.now() }).catch(e => {
                if (e.code === 'permission-denied') {
                    showToast("Firestore Error: Permission Denied. Ilagay ang Firestore sa 'Test Mode' sa loob ng Firebase console.", "error");
                }
            });

            if (sessionUnsubscribe) sessionUnsubscribe();
            sessionUnsubscribe = onSnapshot(sessionRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.sessionId !== mySessionId) {
                        state.sessionConflict = true;
                        window.endSession();
                        renderApp();
                    }
                }
            }, (error) => console.error("Session listener error:", error));
        }

        window.takeoverSession = () => {
            state.sessionConflict = false;
            enforceSingleSession(); 
            renderApp();
        };

        let cloudSaveTimer = null;

        async function setupCloudSync() {
            if (!userId || !db || state.sessionConflict) return;
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'appData', 'vault');
            try {
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.folders) state.folders = data.folders;
                    if (data.terms) state.terms = data.terms;
                    if (data.history) state.history = data.history;
                    if (data.activityLog && typeof data.activityLog === 'object') {
                        state.activityLog = data.activityLog;
                        localStorage.setItem('elementVaultActivityLog', JSON.stringify(state.activityLog));
                    }
                    if (data.geminiApiKey) {
                        state.geminiApiKey = data.geminiApiKey;
                        localStorage.setItem('elementVaultGeminiKey', state.geminiApiKey);
                    }
                    if (data.geminiModel && data.geminiModel !== 'gemini-3-flash-preview') {
                        state.geminiModel = data.geminiModel;
                        localStorage.setItem('elementVaultGeminiModel', state.geminiModel);
                    } else {
                        state.geminiModel = 'auto';
                        localStorage.setItem('elementVaultGeminiModel', 'auto');
                    }

        function scoreModelForFreeTier(m) {
            const id = String(m.id || '').toLowerCase();
            const disp = String(m.displayName || '').toLowerCase();
            const combined = `${id} ${disp}`;

            // Exclude non-text or deprecated zero-quota models
            if (/tts|image|imagen|veo|embedding|aqa|audio|robotics|computer-use|learnlm|thinking|2\.0-flash-exp|2\.0-flash-lite-preview|1\.5/i.test(id)) {
                return -9999;
            }
            // Gemini 3 Flash has only 20 RPD on free tier -> keep as absolute last resort
            if (/gemini-3-flash/i.test(id) && !/lite/i.test(combined)) {
                return 10;
            }

            let ver = 20;
            const verMatch = combined.match(/(\d+\.\d+|\d+)/);
            if (verMatch) {
                const parsed = parseFloat(verMatch[1]);
                if (!isNaN(parsed) && parsed <= 9) ver = Math.round(parsed * 10);
            }

            // 1. Flash-Lite models (500 RPD on Free Tier!) -> Newest version first (3.5 / 3.1 / 2.5)
            if (/lite/i.test(combined) && /flash/i.test(combined)) {
                const stableBonus = /preview|exp/i.test(id) ? 0 : 5;
                return 1000 + (ver * 10) + stableBonus;
            }
            // 2. Gemma 3 IT models on Google AI Studio (14,400 RPD on Free Tier with standard AIza key!)
            if (/^gemma-3-.*-it$/i.test(id)) {
                if (/27b/i.test(id)) return 950;
                if (/12b/i.test(id)) return 940;
                return 920;
            }
            // 3. Standard Flash models (2.5 Flash, etc.)
            if (/flash/i.test(combined)) {
                return 700 + (ver * 10);
            }
            return 100 + ver;
        }

        async function discoverKeyModels(activeKey) {
            if (!activeKey || activeKey.startsWith('gsk_')) return null;
            if (discoveredModelsByKey[activeKey]) return discoveredModelsByKey[activeKey];

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${activeKey}`);
                if (!res.ok) return null;
                const data = await res.json();
                const rawList = (data.models || []).filter(m =>
                    Array.isArray(m.supportedGenerationMethods) &&
                    m.supportedGenerationMethods.includes('generateContent')
                ).map(m => {
                    const obj = {
                        id: String(m.name || '').replace(/^models\//, ''),
                        displayName: String(m.displayName || m.name || '')
                    };
                    obj.score = scoreModelForFreeTier(obj);
                    return obj;
                }).filter(m => m.id && m.score > 0);

                // Sort highest free-tier quota models first (Newest Flash-Lite 500 RPD -> Gemma 3 14.4K RPD -> Standard Flash)
                rawList.sort((a, b) => b.score - a.score);

                if (rawList.length > 0) {
                    discoveredModelsByKey[activeKey] = rawList;
                    rawList.forEach(dm => {

        let currentKeyIndex = 0;

        async function callGeminiAPI(systemPrompt, userQuery, silent = false) {
            const rawKeys = (state.geminiApiKey || '').trim();
            if (!rawKeys) return null;

            // Support multiple API keys (separated by newline or comma) for automatic quota rotation
            const keyList = rawKeys.split(/[\n,]+/).map(k => k.trim()).filter(Boolean);
            if (keyList.length === 0) return null;

            const combinedPrompt = `${systemPrompt}\n\n${userQuery}`;
            let lastErrorMsg = '';

            for (let kOffset = 0; kOffset < keyList.length; kOffset++) {
                const idx = (currentKeyIndex + kOffset) % keyList.length;
                const activeKey = keyList[idx];

                // 1. If it's a Groq API Key (starts with gsk_) -> 14,400 requests/day free tier!
                if (activeKey.startsWith('gsk_')) {
                    const groqModels = (state.geminiModel && state.geminiModel.startsWith('llama-'))
                        ? [state.geminiModel, 'llama-3.1-8b-instant']
                        : ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant'];
                    for (const gModel of groqModels) {
                        try {
                            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${activeKey}`
                                },
                                body: JSON.stringify({
                                    model: gModel,
                                    messages: [
                                        { role: 'system', content: systemPrompt },
                                        { role: 'user', content: userQuery }
                                    ],
                                    temperature: 0.2
                                })
                            });
                            if (res.ok) {
                                const data = await res.json();
                                const text = data.choices?.[0]?.message?.content || '';
                                if (text) {
                                    currentKeyIndex = idx;
                                    return text;
                                }
                            } else {
                                const errData = await res.json().catch(() => ({}));
                                lastErrorMsg = errData.error?.message || `HTTP ${res.status}`;
                            }
                        } catch (e) {
                            lastErrorMsg = e.message;
                        }
                    }
                    continue;
                }

                // 2. Standard Google Gemini API Key (AIza...)
                if (!deadModelsByKey[activeKey]) deadModelsByKey[activeKey] = new Set();
                const deadSet = deadModelsByKey[activeKey];

                // Discover exact valid model IDs supported by this API key (0 quota cost, sorted newest Flash-Lite 500 RPD first!)
                const discovered = await discoverKeyModels(activeKey);
                let candidatePool = [];

                if (discovered && discovered.length > 0) {
                    // Use ONLY verified model IDs that actually exist on Google's server for this key (prevents 404 NotFound!)
                    candidatePool = discovered.map(m => m.id).filter(id => !deadSet.has(id));
                } else {
                    candidatePool = [
                        'gemini-2.5-flash-lite',
                        'gemini-3.1-flash-lite-preview',
                        'gemma-3-27b-it',
                        'gemini-2.5-flash',
                        'gemini-2.0-flash'
                    ].filter(id => !deadSet.has(id));
                }

                let modelsToTry = [];
                const chosen = state.geminiModel || 'auto';

                // Priority 1: If user chose a specific model and it's not dead, match it against discovered models first
                if (chosen !== 'auto' && !chosen.startsWith('llama-') && !deadSet.has(chosen)) {
                    if (discovered && discovered.length > 0) {
                        const exactMatch = discovered.find(m => m.id === chosen);
                        const fuzzyLiteMatch = (!exactMatch && /lite/i.test(chosen))
                            ? discovered.find(m => (/lite/i.test(m.id) || /lite/i.test(m.displayName)) && !deadSet.has(m.id))
                            : null;
                        if (exactMatch) {
                            modelsToTry.push(exactMatch.id);
                        } else if (fuzzyLiteMatch) {
                            modelsToTry.push(fuzzyLiteMatch.id);
                        }
                    } else {
                        modelsToTry.push(chosen);
                    }
                }

                // Priority 2: Previously verified working model in this session
                if (workingModelByKey[activeKey] && !deadSet.has(workingModelByKey[activeKey])) {
                    modelsToTry.push(workingModelByKey[activeKey]);
                }

                // Priority 3: All other high-quota discovered models (500 RPD Flash-Lite -> 14.4K RPD Gemma 3 -> Standard Flash)
                modelsToTry.push(...candidatePool);
                modelsToTry = modelsToTry.filter((v, i, a) => v && a.indexOf(v) === i).slice(0, 6);

                for (let mIdx = 0; mIdx < modelsToTry.length; mIdx++) {
                    const modelName = modelsToTry[mIdx];
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`;
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: combinedPrompt }] }]
                            })
                        });
                        if (response.ok) {
                            const result = await response.json();
                            const text = result.candidates?.[0]?.content?.parts?.[0]?.text || '';
                            if (text) {
                                currentKeyIndex = idx;
                                workingModelByKey[activeKey] = modelName;
                                if (state.geminiModel !== 'auto' && state.geminiModel !== modelName) {
                                    state.geminiModel = modelName;
                                    localStorage.setItem('elementVaultGeminiModel', modelName);
                                }
                                return text;
                            }
                        } else {
                            const errBody = await response.json().catch(() => ({}));
                            const errText = errBody.error?.message || `HTTP ${response.status}`;
                            lastErrorMsg = `${modelName} (${response.status}): ${errText}`;
                            // If API key itself is invalid (403 or 400 API_KEY_INVALID), break model loop and try next key
                            if (response.status === 403 || (response.status === 400 && /key/i.test(errText))) {
                                break;
                            }
                            // Mark this specific model as dead (404 NotFound / 429 Quota Exceeded / 400 Unsupported) so we immediately switch to the next working model!
                            if (response.status === 404 || response.status === 429 || response.status === 400) {
                                deadSet.add(modelName);
                            }
                        }
                    } catch (e) {
                        lastErrorMsg = e.message;
                    }
                }
            }

            if (!silent && lastErrorMsg) {
                const shortErr = lastErrorMsg.length > 95 ? lastErrorMsg.slice(0, 95) + '…' : lastErrorMsg;
                showToast(`AI Error: ${shortErr}`, "error");
            }
            return null;
        }

        // --- QUESTION PARSING, PROGRESSIVE BLUR & DYNAMIC CHOICE SHUFFLING HELPERS ---
        function parseQuestionAndChoices(rawQuestion) {
            const raw = String(rawQuestion || '');
            if (!raw.includes('[Choices]:')) {
                return { stem: raw.trim(), choicesRaw: '', hasChoices: false, parsedChoices: null };
            }
            const parts = raw.split('[Choices]:');
            const stem = parts[0].trim();
            const choicesRaw = (parts[1] || '').trim();

            const regex4 = /A\.\s*(.*?)\s*B\.\s*(.*?)\s*C\.\s*(.*?)\s*D\.\s*(.*)/is;
            const match4 = choicesRaw.match(regex4);
            if (match4) {
                return {
                    stem,
                    choicesRaw,
                    hasChoices: true,
                    parsedChoices: [
                        { origLetter: 'A', text: match4[1].trim() },
                        { origLetter: 'B', text: match4[2].trim() },
                        { origLetter: 'C', text: match4[3].trim() },
                        { origLetter: 'D', text: match4[4].trim() }
                    ]
                };
            }

            const regex3 = /A\.\s*(.*?)\s*B\.\s*(.*?)\s*C\.\s*(.*)/is;
            const match3 = choicesRaw.match(regex3);
            if (match3) {
                return {
                    stem,
                    choicesRaw,
                    hasChoices: true,
                    parsedChoices: [
                        { origLetter: 'A', text: match3[1].trim() },
                        { origLetter: 'B', text: match3[2].trim() },
                        { origLetter: 'C', text: match3[3].trim() }
                    ]
                };
            }

            return { stem, choicesRaw, hasChoices: true, parsedChoices: null };
        }

        function isLongQuestionStem(stemText) {
            const clean = String(stemText || '').trim();
            const explicitLines = clean.split(/\r?\n/).filter(l => l.trim().length > 0);
            if (explicitLines.length >= 3) return true;
            // In Courier New monospace inside the review card (~42-48 chars/line), 3+ lines is >= 110 characters
            return clean.length >= 110;
        }

        function fallbackLogicalStemSplit(stemText) {
            const clean = String(stemText || '').trim();
            if (!isLongQuestionStem(clean)) return [clean];

            // 1. Check for Roman numeral list or multi-sentence boundary
            const trapOrQuestionRegex = /\b(which of the following|what is the|what are the|determine the|find the|calculate the|this phenomenon is|this process is|it is called|is called|is known as|is termed|the allowance is|some metal parts|the sum of these|there must be|except\b|not true)/ig;
            let bestIdx = -1;
            let match;
            while ((match = trapOrQuestionRegex.exec(clean)) !== null) {
                const idx = match.index;
                if (idx >= clean.length * 0.28 && idx <= clean.length * 0.85) {
                    bestIdx = idx;
                    break;
                }
            }

            if (bestIdx !== -1) {
                const c1 = clean.slice(0, bestIdx).trim();
                const c2 = clean.slice(bestIdx).trim();
                if (c1 && c2) return [c1, c2];
            }

            // 2. Sentence boundary (. / ; / ?) between 30% and 80%
            const punctRegex = /[.;?]\s+/g;
            let punctMatch;
            let candidateSplit = -1;
            const mid = clean.length * 0.55;
            while ((punctMatch = punctRegex.exec(clean)) !== null) {
                const splitPos = punctMatch.index + punctMatch[0].length;
                if (splitPos >= clean.length * 0.25 && splitPos <= clean.length * 0.85) {
                    if (candidateSplit === -1 || Math.abs(splitPos - mid) < Math.abs(candidateSplit - mid)) {
                        candidateSplit = splitPos;
                    }
                }
            }
            if (candidateSplit !== -1) {
                return [clean.slice(0, candidateSplit).trim(), clean.slice(candidateSplit).trim()];
            }

            // 3. Comma boundary near middle
            const commaRegex = /,\s+/g;
            let commaMatch;
            while ((commaMatch = commaRegex.exec(clean)) !== null) {
                const splitPos = commaMatch.index + commaMatch[0].length;
                if (splitPos >= clean.length * 0.35 && splitPos <= clean.length * 0.75) {
                    if (candidateSplit === -1 || Math.abs(splitPos - mid) < Math.abs(candidateSplit - mid)) {
                        candidateSplit = splitPos;
                    }
                }
            }
            if (candidateSplit !== -1) {
                return [clean.slice(0, candidateSplit).trim(), clean.slice(candidateSplit).trim()];
            }

            // 4. Word boundary around 58%
            const targetIdx = Math.floor(clean.length * 0.58);
            const spaceIdx = clean.indexOf(' ', targetIdx);
            if (spaceIdx !== -1 && spaceIdx < clean.length - 10) {
                return [clean.slice(0, spaceIdx).trim(), clean.slice(spaceIdx + 1).trim()];
            }
            return [clean];
        }

        function isLockedLastChoiceText(choiceText) {
            const t = String(choiceText || '').trim();
            if (/^(all|none)\.?$/i.test(t)) return true;
            return /\b(all of the above|none of the above|all of these|none of these|all the above|none the above|both a and b|both a\s*&\s*b|both b and c|both a and c|a and b|a\s*&\s*b)\b/i.test(t);
        }

        function buildShuffledChoicesForCard(card) {
            const parsed = parseQuestionAndChoices(card.question);
            if (!parsed.parsedChoices) return null;

            const cleanAns = String(card.answer || '').trim();
            const upperAns = cleanAns.toUpperCase();
            const isLetterAns = ['A', 'B', 'C', 'D'].includes(upperAns);

            const annotated = parsed.parsedChoices.map(opt => {
                let isCorrect = false;
                if (isLetterAns) {
                    isCorrect = (opt.origLetter === upperAns);
                } else if (upperAns.startsWith(opt.origLetter + '.')) {
                    isCorrect = true;
                } else {
                    isCorrect = (opt.text.trim().toUpperCase() === upperAns);
                }
                return {
                    ...opt,
                    isCorrect,
                    lockLast: isLockedLastChoiceText(opt.text)
                };
            });

            const normalChoices = annotated.filter(o => !o.lockLast);
            const lockedChoices = annotated.filter(o => o.lockLast);

            shuffleArray(normalChoices);

            const combined = [...normalChoices, ...lockedChoices];
            const letters = ['A', 'B', 'C', 'D'];
            return combined.map((opt, idx) => ({
                ...opt,
                displayLetter: letters[idx] || String.fromCharCode(65 + idx)
            }));
        }

        function initCardSessionState() {
            if (!state.sessionData || !state.sessionData.queue[state.currentCardIndex]) return;
            const currentCard = state.sessionData.queue[state.currentCardIndex];
            const { stem } = parseQuestionAndChoices(currentCard.question);
            const longStem = isLongQuestionStem(stem);

            state.showAnswer = false;
            state.selectedChoice = null;
            state.showKeywordsExp = false;
            state.isEditingExplanation = false;
            state.showTaglishSimplified = false;
            state.isEditingTaglish = false;
            state.revealedChoicesCount = 0;
            currentCardStartTs = Date.now();
            state.currentShuffledChoices = {
                cardId: currentCard.id,
                questionSnapshot: currentCard.question,
                answerSnapshot: currentCard.answer,
                options: buildShuffledChoicesForCard(currentCard)
            };

            if (longStem) {
                state.revealStep = 0; // Blur Chunk 2 + Blur All Choices
                if (!Array.isArray(currentCard.stemChunks) || currentCard.stemChunks.length < 2) {
                    window.ensureAIStemSplit(currentCard.id);
                }
            } else {
                state.revealStep = 1; // Full short stem readable; Blur All Choices initially
            }
        }

        // Instant Zero-Quota Stem Split (Caches 2 logical chunks immediately without burning API quota on every card load!)
        window.ensureAIStemSplit = async (termId) => {
            const term = state.terms.find(t => t.id === termId);
            if (!term || term.isSplittingStem) return;
            const { stem } = parseQuestionAndChoices(term.question);
            if (!isLongQuestionStem(stem)) return;
            if (Array.isArray(term.stemChunks) && term.stemChunks.length === 2) return;

            const chunks = fallbackLogicalStemSplit(stem);
            updateTerm(termId, {
                stemChunks: chunks,
                isSplittingStem: false
            });
        };

        // --- FINISH-TIME CLOCK PREDICTOR (SMART WEIGHTED ROLLING PACE) ---
        function formatDurationHoursMins(totalSeconds) {
            const sec = Math.max(0, Math.round(totalSeconds || 0));
            if (sec === 0) return '0m';
            if (sec < 60) return '< 1m';
            const totalMins = Math.ceil(sec / 60);
            if (totalMins < 60) return `${totalMins}m`;
            const hrs = Math.floor(totalMins / 60);
            const remMins = totalMins % 60;
            return remMins > 0 ? `${hrs}h ${remMins}m` : `${hrs}h`;
        }

        function computeSessionEtaInfo() {
            if (!state.sessionData || !Array.isArray(state.sessionData.queue) || state.sessionData.queue.length === 0) {
                return null;
            }
            const remainingCards = state.sessionData.type === 'intake'
                ? state.sessionData.queue.length
                : Math.max(0, state.sessionData.queue.length - state.currentCardIndex);

            let secPerCard = Math.min(state.timePerCard || 10, 12);
            let isLivePace = false;

            if (sessionCardDurations.length > 0) {
                // Weighted rolling average of last 8 cards (more recent cards weigh higher so speeding up updates ETA quickly!)
                let weightedSum = 0;
                let weightTotal = 0;
                sessionCardDurations.forEach((sec, idx) => {
                    const w = 1 + (idx * 0.35);
                    weightedSum += sec * w;
                    weightTotal += w;
                });
                secPerCard = weightedSum / weightTotal;
                isLivePace = true;
            }

            const totalSecLeft = remainingCards * secPerCard;
            const now = new Date();
            const etaDate = new Date(now.getTime() + (totalSecLeft * 1000));
            const clockStr = etaDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            const isNextDay = etaDate.getDate() !== now.getDate() || etaDate.getMonth() !== now.getMonth();
            const clockText = isNextDay ? `${clockStr} (+1d)` : clockStr;
            const remainingText = formatDurationHoursMins(totalSecLeft);
            return {
                clockText,
                remainingText,
                displayText: `${clockText} • ${remainingText}`,
                secPerCard: secPerCard.toFixed(1),
                remainingCards,
                isLivePace
            };
        }

        function updateEtaClockUI() {
            if (!state.showEtaPredictor || state.currentView !== 'session') return;
            const clockEl = document.getElementById('session-eta-clock');
            const pillEl = document.getElementById('session-eta-pill');
            if (!clockEl) return;
            const eta = computeSessionEtaInfo();
            if (!eta) return;
            clockEl.textContent = eta.displayText;
            if (pillEl) {
                pillEl.title = `Expected finish: ${eta.clockText} (${eta.remainingText} left • ~${eta.secPerCard}s/card • ${eta.remainingCards} cards). Click to hide`;
            }
        }

        function manageEtaInterval() {
            clearInterval(etaRefreshInterval);
            if (state.currentView === 'session' && state.sessionData && state.showEtaPredictor) {
                etaRefreshInterval = setInterval(updateEtaClockUI, 5000);
            }
        }

        window.toggleEtaPredictor = (event) => {
            if (event) event.stopPropagation();
            state.showEtaPredictor = !state.showEtaPredictor;
            localStorage.setItem('elementVaultShowEta', state.showEtaPredictor ? 'true' : 'false');
            manageEtaInterval();
            renderApp();
        };

        // =========================================================================
        // MELE (FEB 2027) TOPNOTCHER ENGINE, TELEMETRY, SMART QUEUE & DAILY ORDERS
        // =========================================================================
        function getTodayDateKey() {
            return new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD (local)
        }

        function getYesterdayDateKey() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return d.toLocaleDateString('en-CA');
        }

        function getTodayAdaptiveTarget() {
            const dow = new Date().getDay(); // 0=Sun .. 6=Sat
            const val = Number(state.weeklyTargets && state.weeklyTargets[dow]);
            return val > 0 ? val : 80;
        }

        function safeHaptic(pattern) {
            try {
                if (navigator && typeof navigator.vibrate === 'function') {
                    navigator.vibrate(pattern);
                }
            } catch (e) {}
        }

        function ensureDailyTelemetry(dateKey = getTodayDateKey()) {
            if (!state.dailyTelemetry || typeof state.dailyTelemetry !== 'object') state.dailyTelemetry = {};
            if (!state.dailyTelemetry[dateKey]) {
                state.dailyTelemetry[dateKey] = {
                    levelUps: { '0->1': 0, '1->2': 0, '2->3': 0, '3->4': 0, '4->5': 0, '5->6': 0, net: 0 },
                    leechesTamed: 0,
                    lockedToday: 0,
                    addedToday: 0,
                    clearedToday: 0,
                    forwardAns: 0,
                    loopbackAns: 0,
                    paceBrackets: { b1: { c: 0, w: 0 }, b2: { c: 0, w: 0 }, b3: { c: 0, w: 0 }, b4: { c: 0, w: 0 } },
                    cleanBlockSec: 0,
                    cleanBlockC: 0,
                    cleanBlockW: 0,
                    cleanBlocksEarned: 0,
                    breakBankClaimed: 0,
                    promotedWeakSubjectCards: 0,
                    newCardsUnlocked: 0,
                    deliberateAccurateToday: 0,
                    leechSurgeriesDone: 0,
                    ordersSnapshot: null,
                    ordersClearedFlags: { mastery: false, leech: false, sharpness: false }
                };
            }
            const t = state.dailyTelemetry[dateKey];
            if (!t.levelUps) t.levelUps = { '0->1': 0, '1->2': 0, '2->3': 0, '3->4': 0, '4->5': 0, '5->6': 0, net: 0 };
            if (!t.paceBrackets) t.paceBrackets = { b1: { c: 0, w: 0 }, b2: { c: 0, w: 0 }, b3: { c: 0, w: 0 }, b4: { c: 0, w: 0 } };
            if (!t.ordersClearedFlags) t.ordersClearedFlags = { mastery: false, leech: false, sharpness: false };
            if (typeof t.deliberateAccurateToday !== 'number') t.deliberateAccurateToday = 0;
            return t;
        }

        function isActiveLeechCard(t) {
            return Boolean(t && !t.isErroneous && !t.isNew && (t.incorrect || 0) >= 2 && (t.level || 0) <= 2);
        }

        function isLockedForFeb2027(t) {
            return Boolean(t && !t.isErroneous && !t.isNew && ((t.level || 0) >= 6 || (t.nextReviewDate || 0) > MELE_POST_EXAM_MS));
        }

        function getCardExamDayWeight(t) {
            if (!t || t.isNew) return 0;
            if ((t.level || 0) >= 6 || (t.nextReviewDate || 0) > MELE_POST_EXAM_MS) return 0.98;
            const lv = Math.min(Math.max(t.level || 1, 1), 6);
            const map = { 1: 0.30, 2: 0.50, 3: 0.72, 4: 0.86, 5: 0.94, 6: 0.98 };
            return map[lv] || 0.30;
        }

        function mapFolderToPrcSubject(folderId) {
            const fullPath = getFolderFullPath(folderId, state.folders || []).toLowerCase();
            if (/\bpipe\b|power\s*plant|thermo|fluid|heat\s*transfer|refrig|aircon|hvac|boiler|turbine|compressor|steam|combustion/.test(fullPath)) return 'PIPE';
            if (/\bmdsp\b|machine\s*design|shop\s*practice|gear|shaft|bearing|belt|weld|rivet|spring|flywheel|clutch|brake|metallurgy/.test(fullPath)) return 'MDSP';
            if (/\bmesl\b|math|econ|mechanics|strength|materials|statics|dynamics|engineering\s*science|\bes\b/.test(fullPath)) return 'MESL';
            return 'UNMAPPED';
        }

        function getTopnotcherScopedTerms(termsList = state.terms, scope = state.topnotcherScope) {
            const allNonErr = (termsList || []).filter(t => !t.isErroneous);
            if (scope === 'prime') {
                const primeFolderIds = new Set(
                    (state.folders || [])
                        .filter(f => /\bprime\b/i.test(getFolderFullPath(f.id, state.folders)))
                        .map(f => f.id)
                );
                if (primeFolderIds.size > 0) {
                    const primeTerms = allNonErr.filter(t => primeFolderIds.has(t.folderId));
                    if (primeTerms.length > 0) return { terms: primeTerms, scopeFallback: false };
                }
                return { terms: allNonErr, scopeFallback: true };
            }
            return { terms: allNonErr, scopeFallback: false };
        }

        // Compute actual Card Addition Rate (cards/day) from history['all'] + live dailyTelemetry.addedToday
        function computeCardIntakeRate() {
            const histAll = (state.history && state.history.all) ? state.history.all : {};
            const dates = Object.keys(histAll).sort().slice(-15);
            const todayKey = getTodayDateKey();
            const todayTel = ensureDailyTelemetry(todayKey);
            const addedTodayLive = Number(todayTel.addedToday) || 0;

            const dailyAdds = [];
            for (let i = 1; i < dates.length; i++) {
                const prevTot = Number(histAll[dates[i - 1]]?.total) || 0;
                const currTot = Number(histAll[dates[i]]?.total) || 0;
                const dtPrev = new Date(dates[i - 1] + 'T00:00:00');
                const dtCurr = new Date(dates[i] + 'T00:00:00');
                const dayGap = Math.max(1, Math.round((dtCurr - dtPrev) / MS_PER_DAY));
                const rawInc = Math.max(0, currTot - prevTot);
                // Distribute multi-day gaps evenly; damp single-day bulk imports (>60) for steady ongoing rate
                const perDayRaw = rawInc / dayGap;
                const perDayDamped = Math.min(60, perDayRaw);
                for (let g = 0; g < Math.min(dayGap, 7); g++) {
                    dailyAdds.push({ date: dates[i], raw: perDayRaw, damped: perDayDamped });
                }
            }
            if (addedTodayLive > 0 && (dates.length === 0 || dates[dates.length - 1] !== todayKey)) {
                dailyAdds.push({ date: todayKey, raw: addedTodayLive, damped: Math.min(60, addedTodayLive) });
            }

            let raw14dRate = 0;
            let steadyAutoRate = 0;
            let addedLast7d = 0;
            if (dailyAdds.length > 0) {
                const last14 = dailyAdds.slice(-14);
                raw14dRate = last14.reduce((a, x) => a + x.raw, 0) / last14.length;
                const recent7 = last14.slice(-7);
                const older7 = last14.slice(0, Math.max(0, last14.length - 7));
                const avgRecent = recent7.reduce((a, x) => a + x.damped, 0) / recent7.length;
                const avgOlder = older7.length > 0 ? older7.reduce((a, x) => a + x.damped, 0) / older7.length : avgRecent;
                steadyAutoRate = Math.round((avgRecent * 0.65 + avgOlder * 0.35) * 10) / 10;
                addedLast7d = Math.round(recent7.reduce((a, x) => a + x.raw, 0));
            } else {
                steadyAutoRate = addedTodayLive;
                raw14dRate = addedTodayLive;
                addedLast7d = addedTodayLive;
            }

            const isCustom = state.intakeRateMode === 'custom';
            const effectiveRate = isCustom
                ? Math.max(0, Math.min(200, Number(state.customIntakeRate) || 0))
                : steadyAutoRate;

            return {
                mode: isCustom ? 'custom' : 'auto',
                effectiveRate: Math.round(effectiveRate * 10) / 10,
                steadyAutoRate: Math.round(steadyAutoRate * 10) / 10,
                raw14dRate: Math.round(raw14dRate * 10) / 10,
                addedLast7d,
                addedTodayLive
            };
        }

        // Fast deterministic projection of days & review workload to reach L5 mastery (INCLUDING incoming card addition rate!)
        function estimateWorkloadToL5(cards, dailyQuota, projectedAddedCards = 0) {
            const quota = Math.max(15, Number(dailyQuota) || 60);
            const remainingReviewsCurrent = (cards || []).reduce((acc, t) => {
                if (t.isNew) return acc + 6.4;
                const lv = t.level || 1;
                if (lv >= 5 || (t.nextReviewDate || 0) > MELE_POST_EXAM_MS) return acc;
                const expMap = { 1: 5.0, 2: 3.7, 3: 2.3, 4: 1.15 };
                return acc + (expMap[lv] || 0);
            }, 0);
            const futureReviewsWorkload = Math.max(0, Number(projectedAddedCards) || 0) * 6.4;
            const totalWorkUnits = remainingReviewsCurrent + futureReviewsWorkload;
            if (totalWorkUnits <= 0.1) {
                return { days: 1, remainingReviewsCurrent: 0, futureReviewsWorkload: 0, totalWorkUnits: 0 };
            }
            // Account for minimum SRS spacing floor (L0->L5 takes at least 1+3+7+15 = 26d if any L0-L1 or future cards exist)
            const hasLow = projectedAddedCards > 0 || (cards || []).some(t => t.isNew || (t.level || 0) <= 1);
            const hasMid = (cards || []).some(t => !t.isNew && t.level === 2);
            const minSpanFloor = hasLow ? 26 : hasMid ? 22 : 12;
            const workloadDays = Math.ceil(totalWorkUnits / quota);
            return {
                days: Math.max(minSpanFloor, workloadDays),
                remainingReviewsCurrent: Math.round(remainingReviewsCurrent),
                futureReviewsWorkload: Math.round(futureReviewsWorkload),
                totalWorkUnits: Math.round(totalWorkUnits)
            };
        }

        function estimateDaysToL5Deterministic(cards, dailyQuota, projectedAddedCards = 0) {
            return estimateWorkloadToL5(cards, dailyQuota, projectedAddedCards).days;
        }

        function compute14DayRollingSharpness(scopedTerms, activityLogObj = state.activityLog) {
            const log = activityLogObj || {};
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 13);
            const cutoffKey = cutoff.toLocaleDateString('en-CA');
            const recentKeys = Object.keys(log).filter(k => k >= cutoffKey).sort().slice(-14);

            let c = 0, w = 0;
            recentKeys.forEach(dKey => {
                const hrs = log[dKey] || {};
                Object.keys(hrs).forEach(hKey => {
                    c += Number(hrs[hKey]?.c) || 0;
                    w += Number(hrs[hKey]?.w) || 0;
                });
            });
            if (c + w >= 5) {
                return { pct: (c / (c + w)) * 100, c, w, daysUsed: recentKeys.length, isFallback: false };
            }
            // Fallback to scoped card history if < 5 live logged answers so Day 1 is realistic
            const tc = (scopedTerms || []).reduce((a, t) => a + (t.correct || 0), 0);
            const tw = (scopedTerms || []).reduce((a, t) => a + (t.incorrect || 0), 0);
            const pct = (tc + tw) > 0 ? (tc / (tc + tw)) * 100 : 0;
            return { pct, c: tc, w: tw, daysUsed: recentKeys.length, isFallback: true };
        }

        function get7DayMedianDailyCards() {
            const log = state.activityLog || {};
            const counts = [];
            for (let i = 1; i <= 7; i++) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const key = d.toLocaleDateString('en-CA');
                const hrs = log[key] || {};
                let sum = 0;
                Object.keys(hrs).forEach(h => { sum += (Number(hrs[h]?.c) || 0) + (Number(hrs[h]?.w) || 0); });
                if (sum > 0) counts.push(sum);
            }
            if (counts.length === 0) return getTodayAdaptiveTarget();
            counts.sort((a, b) => a - b);
            const mid = Math.floor(counts.length / 2);
            return counts.length % 2 === 1 ? counts[mid] : Math.round((counts[mid - 1] + counts[mid]) / 2);
        }

        function computeTopnotcherIndex(termsOverride = null, scopeOverride = null, activityOverride = null) {
            const scope = scopeOverride || state.topnotcherScope || 'full';
            const { terms: scopedTerms, scopeFallback } = getTopnotcherScopedTerms(termsOverride || state.terms, scope);
            const total = scopedTerms.length;

            // --- Pillar 1 (45%): Exam-Day Mastery (PRC-weighted 35% PIPE, 35% MDSP, 30% MESL; fallback unweighted) ---
            const PRC_WEIGHTS = { PIPE: 0.35, MDSP: 0.35, MESL: 0.30 };
            const subjectBuckets = { PIPE: [], MDSP: [], MESL: [], UNMAPPED: [] };
            scopedTerms.forEach(t => {
                const subj = mapFolderToPrcSubject(t.folderId);
                subjectBuckets[subj].push(t);
            });

            const subjectStats = {};
            ['PIPE', 'MDSP', 'MESL'].forEach(subj => {
                const arr = subjectBuckets[subj];
                if (arr.length > 0) {
                    const avgScore = (arr.reduce((a, t) => a + getCardExamDayWeight(t), 0) / arr.length) * 100;
                    const l12Count = arr.filter(t => !t.isNew && (t.level || 0) <= 2).length;
                    subjectStats[subj] = { count: arr.length, pct: avgScore, weight: PRC_WEIGHTS[subj], l12Count };
                }
            });

            const mappedSubjects = Object.keys(subjectStats);
            const isPrcWeighted = mappedSubjects.length >= 2;
            let masteryPct = 0;
            if (total > 0) {
                if (isPrcWeighted) {
                    let wSum = 0, wTotal = 0;
                    mappedSubjects.forEach(subj => {
                        wSum += subjectStats[subj].pct * subjectStats[subj].weight;
                        wTotal += subjectStats[subj].weight;
                    });
                    masteryPct = wTotal > 0 ? (wSum / wTotal) : 0;
                } else {
                    masteryPct = (scopedTerms.reduce((a, t) => a + getCardExamDayWeight(t), 0) / total) * 100;
                }
            }

            // Find weakest subject or weakest folder for Biggest Drag & Daily Orders
            let weakestTarget = { name: 'All Sets', type: 'all', pct: masteryPct, folderIds: null, l12Count: scopedTerms.filter(t => !t.isNew && (t.level || 0) <= 2).length };
            if (mappedSubjects.length >= 2) {
                const worstSubj = mappedSubjects.sort((a, b) => subjectStats[a].pct - subjectStats[b].pct)[0];
                const subjFolderIds = (state.folders || []).filter(f => mapFolderToPrcSubject(f.id) === worstSubj).map(f => f.id);
                weakestTarget = { name: worstSubj, type: 'subject', pct: subjectStats[worstSubj].pct, folderIds: subjFolderIds, l12Count: subjectStats[worstSubj].l12Count };
            } else {
                const byFolder = {};
                scopedTerms.forEach(t => {
                    if (!byFolder[t.folderId]) byFolder[t.folderId] = [];
                    byFolder[t.folderId].push(t);
                });
                const folderEntries = Object.keys(byFolder).filter(fid => byFolder[fid].length >= 5).map(fid => {
                    const arr = byFolder[fid];
                    const avg = (arr.reduce((a, t) => a + getCardExamDayWeight(t), 0) / arr.length) * 100;
                    const fName = state.folders.find(f => f.id === fid)?.name || 'Deck';
                    return { name: fName, type: 'folder', pct: avg, folderIds: [fid], l12Count: arr.filter(t => !t.isNew && (t.level || 0) <= 2).length };
                }).sort((a, b) => a.pct - b.pct);
                if (folderEntries.length > 0) weakestTarget = folderEntries[0];
            }

            // --- Pillar 2 (25%): 14-Day Rolling Sharpness ---
            const sharpnessObj = compute14DayRollingSharpness(scopedTerms, activityOverride || state.activityLog);
            const sharpnessPct = sharpnessObj.pct;

            // --- Pillar 3 (15%): Leech Control ---
            const reviewedCards = scopedTerms.filter(t => !t.isNew).length;
            const activeLeechesList = scopedTerms.filter(isActiveLeechCard);
            const activeLeeches = activeLeechesList.length;
            const leechControlPct = reviewedCards > 0
                ? Math.max(0, 100 - (activeLeeches / reviewedCards) * 200)
                : 100;

            // --- Pillar 4 (15%): Feb 2027 Trajectory (Factors in Card Addition Rate!) ---
            const todayStart = getTodayStart();
            const daysLeftToExam = Math.max(1, Math.ceil((MELE_EXAM_DATE_MS - todayStart) / MS_PER_DAY));
            const weeklyAvgQuota = Math.round(Object.values(state.weeklyTargets || {}).reduce((a, v) => a + (Number(v) || 80), 0) / 7) || state.forecastQuota || 60;
            const effectiveQuota = Math.max(25, Math.round((weeklyAvgQuota + get7DayMedianDailyCards()) / 2));

            // Factor card intake rate up until the final 21-day exam lock-in freeze before Feb 15, 2027
            const intakeInfo = computeCardIntakeRate();
            const intakeWindowDays = Math.max(0, daysLeftToExam - 21);
            const scopeShare = (state.terms && state.terms.length > 0) ? Math.min(1, total / Math.max(1, state.terms.filter(t => !t.isErroneous).length)) : 1;
            const scopedIntakeRate = Math.round(intakeInfo.effectiveRate * scopeShare * 10) / 10;
            const projectedFutureCards = Math.round(scopedIntakeRate * intakeWindowDays);
            const projectedExamBankSize = total + projectedFutureCards;

            const workloadInfo = estimateWorkloadToL5(scopedTerms, effectiveQuota, projectedFutureCards);
            const projectedDaysToL5 = workloadInfo.days;
            const safeRunwayDays = Math.max(7, daysLeftToExam - 7); // Finish mastery 1 week before exam day
            const requiredDailyReviews = Math.max(15, Math.ceil(workloadInfo.totalWorkUnits / safeRunwayDays));
            const paceMarginPerDay = effectiveQuota - requiredDailyReviews;

            const trajectoryPct = total > 0
                ? Math.min(100, (daysLeftToExam / Math.max(1, projectedDaysToL5)) * 100)
                : 0;

            // --- Composite Score (0–100%) ---
            const score = (0.45 * masteryPct) + (0.25 * sharpnessPct) + (0.15 * leechControlPct) + (0.15 * trajectoryPct);

            // --- Tier ---
            let tier = { label: 'Building Base', color: 'text-slate-700', bg: 'bg-slate-100 border-slate-200', icon: '🧱' };
            if (score >= 92) tier = { label: 'Top 1–3 Contender', color: 'text-amber-700', bg: 'bg-amber-100 border-amber-300', icon: '👑' };
            else if (score >= 88) tier = { label: 'Top 10 Territory', color: 'text-emerald-700', bg: 'bg-emerald-100 border-emerald-300', icon: '🏆' };
            else if (score >= 80) tier = { label: 'Strong Contender', color: 'text-blue-700', bg: 'bg-blue-100 border-blue-300', icon: '🔥' };
            else if (score >= 70) tier = { label: 'Passer Zone', color: 'text-teal-700', bg: 'bg-teal-100 border-teal-300', icon: '✅' };

            // --- 3 Hard Gates ---
            const coveragePct = total > 0 ? (reviewedCards / total) * 100 : 0;
            const gate1Pass = isPrcWeighted
                ? mappedSubjects.every(s => subjectStats[s].pct >= 80)
                : masteryPct >= 80;
            const gate2Pass = coveragePct >= 85;
            const gate3Pass = sharpnessPct >= 85;
            const gatesPassedCount = [gate1Pass, gate2Pass, gate3Pass].filter(Boolean).length;

            // --- Projected Feb 2027 Standing (Incorporating projected future card bank!) ---
            const progressRatio = Math.min(1, daysLeftToExam / Math.max(1, projectedDaysToL5));
            // Effective mastery diluted if incoming cards exceed daily burn capacity
            const currentMasteryOnFutureBank = projectedExamBankSize > 0 ? (masteryPct * (total / projectedExamBankSize)) : masteryPct;
            const projMastery = Math.min(97, currentMasteryOnFutureBank + (96.5 - currentMasteryOnFutureBank) * progressRatio * 0.90);
            const projLeech = Math.min(98, leechControlPct + (96 - leechControlPct) * progressRatio * 0.78);
            const projScore = (0.45 * projMastery) + (0.25 * Math.max(sharpnessPct, 78)) + (0.15 * projLeech) + (0.15 * trajectoryPct);
            let projStandingLabel = 'Building Base';
            if (projScore >= 92) projStandingLabel = '👑 Top 1–3 Contender';
            else if (projScore >= 88) projStandingLabel = '🏆 Top 10 Territory';
            else if (projScore >= 80) projStandingLabel = '🔥 Strong Contender';
            else if (projScore >= 70) projStandingLabel = '✅ Passer Zone';

            // --- Biggest Drag 1-Line Mission Callout ---
            const drags = [
                {
                    key: 'mastery',
                    loss: (100 - masteryPct) * 0.45,
                    msg: `Exam-Day Mastery (${masteryPct.toFixed(1)}%) — "${weakestTarget.name}" is lagging at ${weakestTarget.pct.toFixed(1)}%. Click Daily Order #1 below to promote its L1–L2 cards!`
                },
                {
                    key: 'sharpness',
                    loss: (100 - sharpnessPct) * 0.25,
                    msg: `14-Day Sharpness (${sharpnessPct.toFixed(1)}%) — Slow down past 4s/card and target 85%+ accuracy to clear Gate 3.`
                },
                {
                    key: 'leech',
                    loss: (100 - leechControlPct) * 0.15,
                    msg: `Leech Control (${activeLeeches} active leeches) — Click Daily Order #2 below to tame repeat-miss cards to Level 3.`
                },
                {
                    key: 'trajectory',
                    loss: (100 - trajectoryPct) * 0.15,
                    msg: `Feb 2027 Trajectory (${projectedDaysToL5}d vs ${daysLeftToExam}d left, incl. +${scopedIntakeRate}/d card intake) — Need ~${requiredDailyReviews} reviews/day vs your ${effectiveQuota}/day pace!`
                }
            ].sort((a, b) => b.loss - a.loss);
            const biggestDrag = drags[0];

            // Locked-In for Feb 2027 metrics
            const lockedCount = scopedTerms.filter(isLockedForFeb2027).length;
            const lockedPct = total > 0 ? Math.round((lockedCount / total) * 100) : 0;

            return {
                scope,
                scopeFallback,
                score,
                tier,
                total,
                reviewedCards,
                coveragePct,
                lockedCount,
                lockedPct,
                activeLeeches,
                activeLeechesList,
                daysLeftToExam,
                safeRunwayDays,
                projectedDaysToL5,
                effectiveQuota,
                requiredDailyReviews,
                paceMarginPerDay,
                intakeInfo: {
                    ...intakeInfo,
                    scopedIntakeRate,
                    intakeWindowDays,
                    projectedFutureCards,
                    projectedExamBankSize
                },
                workloadInfo,

                },
                gates: {

                    coverage85: { pass: gate2Pass, label: `Scope Coverage ≥85% (${coveragePct.toFixed(0)}%)` },
                    sharpness85: { pass: gate3Pass, label: `14d Sharpness ≥85% (${sharpnessPct.toFixed(0)}%)` },
                    passedCount: gatesPassedCount
                },

        function formatTop1Score(val, decimals = 2) {
            const num = Number(val) || 0;
            return state.topnotcherDisplayUnit === 'rp'
                ? `${num.toFixed(decimals)} RP`
                : `${num.toFixed(decimals)}%`;
        }

        function formatTop1Delta(delta) {
            const sign = delta >= 0 ? '+' : '';
            const suffix = state.topnotcherDisplayUnit === 'rp' ? ' RP' : '%';
            return `${sign}${delta.toFixed(3)}${suffix}`;
        }

        // Exact Counterfactual Top 1 Impact Simulator for a single card (Instant <1ms!)
        function simulateCardTop1Stakes(card) {
            if (!card) return { gainCorrect: 0, gainPerfect: 0, lossWrong: 0, baseScore: 0 };
            const base = computeTopnotcherIndex();
            const todayStart = getTodayStart();
            const isIntake = state.sessionData && state.sessionData.type === 'intake';
            const todayKey = getTodayDateKey();
            const hrKey = String(new Date().getHours());

            const simOutcome = (answerType) => {
                const clonedTerms = state.terms.map(t => {
                    if (t.id !== card.id) return t;
                    const copy = { ...t };
                    if (isIntake) {
                        if (answerType === 'perfect') {
                            copy.isNew = false; copy.level = 4; copy.nextReviewDate = todayStart + INTERVALS[4] * MS_PER_DAY; copy.correct = (copy.correct || 0) + 1;
                        } else if (answerType === 'correct') {
                            copy.isNew = false; copy.level = 1; copy.nextReviewDate = todayStart + MS_PER_DAY; copy.correct = (copy.correct || 0) + 1;
                        } else {
                            copy.incorrect = (copy.incorrect || 0) + 1;
                        }
                    } else {
                        if (answerType === 'perfect') {
                            const nl = Math.min((copy.level || 1) + 3, 6);
                            copy.isNew = false; copy.level = nl; copy.nextReviewDate = todayStart + INTERVALS[nl] * MS_PER_DAY; copy.correct = (copy.correct || 0) + 1;
                        } else if (answerType === 'correct') {
                            const nl = Math.min((copy.level || 1) + 1, 6);
                            copy.isNew = false; copy.level = nl; copy.nextReviewDate = todayStart + INTERVALS[nl] * MS_PER_DAY; copy.correct = (copy.correct || 0) + 1;
                        } else {
                            copy.isNew = false; copy.level = 1; copy.nextReviewDate = todayStart + INTERVALS[1] * MS_PER_DAY; copy.incorrect = (copy.incorrect || 0) + 1;
                        }
                    }
                    return copy;
                });

                // Simulate 1 answer in activityLog too
                const simLog = { ...(state.activityLog || {}) };
                const dayCopy = { ...(simLog[todayKey] || {}) };
                const hrCopy = { ...(dayCopy[hrKey] || { c: 0, w: 0, s: 0 }) };
                if (answerType === 'wrong') hrCopy.w += 1;
                else hrCopy.c += 1;
                dayCopy[hrKey] = hrCopy;
                simLog[todayKey] = dayCopy;

                return computeTopnotcherIndex(clonedTerms, state.topnotcherScope, simLog).score - base.score;
            };

            return {
                baseScore: base.score,
                gainCorrect: simOutcome('correct'),
                gainPerfect: simOutcome('perfect'),
                lossWrong: simOutcome('wrong')
            };
        }

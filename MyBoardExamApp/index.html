        // Feature 3: Smart Queue Builder (Warm-Up 3 Normal Cards + Interleaved Leeches capped at 5 per 25-card window)
        function buildSmartInterleavedQueue(cards) {
            const normals = cards.filter(c => !isActiveLeechCard(c));
            const leeches = cards.filter(c => isActiveLeechCard(c));
            shuffleArray(normals);
            shuffleArray(leeches);
            // Prioritize L1 & L2 weak normal cards earlier while keeping variety
            normals.sort((a, b) => ((a.level <= 2 ? 1 : 2) - (b.level <= 2 ? 1 : 2)));
            leeches.sort((a, b) => (b.incorrect || 0) - (a.incorrect || 0));

            if (leeches.length === 0 || normals.length === 0) return [...normals, ...leeches];

            const result = [];
            let nIdx = 0;
            let lIdx = 0;

            // Warm-Up: First 3 cards are non-leech cards for momentum
            for (let i = 0; i < 3 && nIdx < normals.length; i++) {
                result.push(normals[nIdx++]);
            }

            // From Card 4 onward: inject 1 Active Leech every 3–4 normal cards (max 5 leeches per 25-card window)
            let windowSize = result.length;
            let leechesInWindow = 0;
            let normalsSinceLeech = 0;

            while (nIdx < normals.length || lIdx < leeches.length) {
                if (windowSize >= 25) {
                    windowSize = 0;
                    leechesInWindow = 0;
                }
                const spacing = (leechesInWindow % 2 === 0) ? 3 : 4;
                const canInjectLeech = lIdx < leeches.length && leechesInWindow < 5 && (normalsSinceLeech >= spacing || nIdx >= normals.length);

                if (canInjectLeech) {
                    result.push(leeches[lIdx++]);
                    leechesInWindow++;
                    normalsSinceLeech = 0;
                    windowSize++;
                } else if (nIdx < normals.length) {
                    result.push(normals[nIdx++]);
                    normalsSinceLeech++;
                    windowSize++;
                } else {
                    result.push(leeches[lIdx++]);
                    windowSize++;
                }
            }
            return result;
        }

        // Feature 11: Practical "Topnotcher Daily Orders" Generator & Auto-Throttle (Zero Extra Firestore Writes!)
        function evaluateDailyOrderThrottle() {
            const todayKey = getTodayDateKey();
            if (!state.orderThrottle) {
                state.orderThrottle = { masteryScale: 1.0, leechScale: 1.0, sharpnessScale: 1.0, consecutiveAllClear: 0, missedStreak: { mastery: 0, leech: 0, sharpness: 0 }, lastEvaluatedDate: null };
            }
            if (state.orderThrottle.lastEvaluatedDate === todayKey) return;

            const yKey = getYesterdayDateKey();
            const yTel = state.dailyTelemetry && state.dailyTelemetry[yKey];
            if (yTel && yTel.ordersSnapshot && Array.isArray(yTel.ordersSnapshot.orders)) {
                const flags = yTel.ordersClearedFlags || {};
                const cats = ['mastery', 'leech', 'sharpness'];
                let clearedCount = 0;
                cats.forEach(cat => {
                    if (flags[cat]) {
                        clearedCount++;
                        state.orderThrottle.missedStreak[cat] = 0;
                    } else {
                        state.orderThrottle.missedStreak[cat] = (state.orderThrottle.missedStreak[cat] || 0) + 1;
                        if (state.orderThrottle.missedStreak[cat] >= 2) {
                            // Auto-throttle down by 15% if missed 2 days in a row
                            const scaleKey = cat + 'Scale';
                            state.orderThrottle[scaleKey] = Math.max(0.50, Math.round((state.orderThrottle[scaleKey] || 1) * 0.85 * 100) / 100);
                            state.orderThrottle.missedStreak[cat] = 0;
                        }
                    }
                });
                if (clearedCount === 3) {
                    state.orderThrottle.consecutiveAllClear = (state.orderThrottle.consecutiveAllClear || 0) + 1;
                    if (state.orderThrottle.consecutiveAllClear >= 3) {
                        // Gentle +10% scale-up after 3 consecutive 3/3 days
                        ['masteryScale', 'leechScale', 'sharpnessScale'].forEach(sk => {
                            state.orderThrottle[sk] = Math.min(1.50, Math.round((state.orderThrottle[sk] || 1) * 1.10 * 100) / 100);
                        });
                        state.orderThrottle.consecutiveAllClear = 0;
                    }
                } else {
                    state.orderThrottle.consecutiveAllClear = 0;
                }
            }
            state.orderThrottle.lastEvaluatedDate = todayKey;
            saveLocalTelemetryOnly();
        }

        // Returns the EXACT cards that advance a given Daily Objective when clicked!
        function getObjectiveCandidateCards(cat, topData = null) {
            const td = topData || computeTopnotcherIndex();
            const todayStart = getTodayStart();
            const scoped = getTopnotcherScopedTerms(state.terms, state.topnotcherScope).terms;
            const tel = ensureDailyTelemetry();
            const snap = tel.ordersSnapshot || {};
            const ord = (snap.orders || []).find(o => o.cat === cat) || null;

            if (cat === 'mastery') {
                const wf = snap.weakestFolderIds || td.weakestTarget.folderIds;
                const sortL12 = (arr) => arr.sort((a, b) => {
                    const dueA = (a.nextReviewDate || 0) <= todayStart ? 0 : 1;
                    const dueB = (b.nextReviewDate || 0) <= todayStart ? 0 : 1;
                    if (dueA !== dueB) return dueA - dueB;
                    if ((a.level || 1) !== (b.level || 1)) return (a.level || 1) - (b.level || 1);
                    return (b.incorrect || 0) - (a.incorrect || 0);
                });
                const primary = sortL12(scoped.filter(t => !t.isNew && (t.level || 0) <= 2 && (!wf || wf.includes(t.folderId))));
                const secondary = wf ? sortL12(scoped.filter(t => !t.isNew && (t.level || 0) <= 2 && !wf.includes(t.folderId))) : [];
                const combined = [...primary, ...secondary];
                const duePrimary = primary.filter(t => (t.nextReviewDate || 0) <= todayStart).length;
                const subjName = snap.weakestName || td.weakestTarget.name;
                return {
                    cards: combined,
                    sessionType: 'review',
                    hint: primary.length > 0
                        ? `${primary.length} L1–L2 cards in "${subjName}" (${duePrimary} due now) • Every Tama/Perfect = +1`
                        : `${combined.length} L1–L2 cards left in scope • Every Tama/Perfect = +1`
                };
            }

            if (cat === 'leech') {
                const leeches = scoped.filter(isActiveLeechCard);
                const l2Leeches = leeches.filter(t => (t.level || 1) === 2).sort((a, b) => (b.incorrect || 0) - (a.incorrect || 0));
                const l1Leeches = leeches.filter(t => (t.level || 1) <= 1).sort((a, b) => (b.incorrect || 0) - (a.incorrect || 0));
                const orderedLeeches = [...l2Leeches, ...l1Leeches];
                if (orderedLeeches.length > 0) {
                    return {
                        cards: orderedLeeches,
                        sessionType: 'leech_surgery',
                        hint: `${l2Leeches.length} L2 leech${l2Leeches.length === 1 ? '' : 'es'} (1 Tama = Tamed!) • ${l1Leeches.length} L1 leech${l1Leeches.length === 1 ? '' : 'es'} (re-queues until L3!)`
                    };
                }
                // Fallback when 0 active leeches exist: play steady review cards keeping 0 new leeches
                const fallbackReview = scoped
                    .filter(t => !t.isNew)
                    .sort((a, b) => ((a.nextReviewDate || 0) <= todayStart ? 0 : 1) - ((b.nextReviewDate || 0) <= todayStart ? 0 : 1) || (a.level || 1) - (b.level || 1));
                return {
                    cards: fallbackReview,
                    sessionType: 'review',
                    hint: `0 Active Leeches! Play ${Math.min(15, fallbackReview.length)} review cards cleanly to keep Leech Control at 100%`
                };
            }

            // Order #3: Sharpness (Coverage New Unlock OR Deliberate Accurate Reviews >=4s)
            if (ord && ord.mode === 'coverage') {
                const wf = snap.weakestFolderIds || td.weakestTarget.folderIds;
                const newWeak = scoped.filter(t => t.isNew && wf && wf.includes(t.folderId));
                const newOther = scoped.filter(t => t.isNew && (!wf || !wf.includes(t.folderId)));
                shuffleArray(newWeak);
                shuffleArray(newOther);
                const newPool = [...newWeak, ...newOther];
                return {
                    cards: newPool,
                    sessionType: 'intake',
                    hint: `${newPool.length} New cards ready (weakest subject prioritized) • Every graduated card = +1`
                };
            }

            // Deliberate Sharpness Reviews (>=4s/card + accurate)
            const dueRev = scoped.filter(t => !t.isNew && (t.nextReviewDate || 0) <= todayStart);
            const futureRev = scoped.filter(t => !t.isNew && (t.nextReviewDate || 0) > todayStart).sort((a, b) => (a.level || 1) - (b.level || 1));
            const smartDue = state.queueMode === 'smart' ? buildSmartInterleavedQueue(dueRev) : [...dueRev];
            const pool = [...smartDue, ...futureRev];
            return {
                cards: pool,
                sessionType: 'review',
                hint: `${dueRev.length} due (${pool.length} total reviewable) • Take ≥4s & answer accurately = +1 each + Clean Block`
            };
        }

        function getOrGenerateDailyOrders(topData = null) {
            evaluateDailyOrderThrottle();
            const td = topData || computeTopnotcherIndex();
            const todayKey = getTodayDateKey();
            const tel = ensureDailyTelemetry(todayKey);
            const todayTarget = getTodayAdaptiveTarget();
            const weeklyAvgQuota = Math.round(Object.values(state.weeklyTargets || {}).reduce((a, v) => a + (Number(v) || 80), 0) / 7) || 80;
            const dayWeight = Math.max(0.6, Math.min(1.5, todayTarget / Math.max(20, weeklyAvgQuota)));
            const median7d = get7DayMedianDailyCards();
            const dailyCap = Math.min(260, Math.max(20, Math.round(median7d * 0.4 + todayTarget * 0.6)));
            // Exact daily reviews mathematically needed today (factoring card addition rate!) to hit Topnotcher by Feb 15, 2027
            const sureTopnotcherTodayQuota = Math.max(20, Math.round(td.requiredDailyReviews * dayWeight));
            const intakeTag = `${state.intakeRateMode}_${td.intakeInfo.effectiveRate}`;

            // Freeze today's order targets once generated for the active scope & intake rate so goals don't jitter mid-day
            if (!tel.ordersSnapshot || tel.ordersSnapshot.scope !== td.scope || tel.ordersSnapshot.intakeTag !== intakeTag || tel.ordersSnapshot.version !== 2) {
                const th = state.orderThrottle || { masteryScale: 1, leechScale: 1, sharpnessScale: 1 };
                const totalCards = Math.max(1, td.total);
                const effectivePaceBase = Math.max(dailyCap, Math.min(dailyCap * 1.45, sureTopnotcherTodayQuota));

                // 1. Mastery / Weakest Subject Order — sized to clear L1–L2 backlog + incoming additions before Feb 2027
                const rawMasteryTarget = Math.max(5, Math.min(40, Math.round(effectivePaceBase * 0.28 * (th.masteryScale || 1))));
                const availL12Scope = getTopnotcherScopedTerms(state.terms, td.scope).terms.filter(t => !t.isNew && (t.level || 0) <= 2).length;
                const availWeak = availL12Scope > 0 ? Math.min(rawMasteryTarget, Math.max(4, td.weakestTarget.l12Count || availL12Scope)) : rawMasteryTarget;
                const estMasteryGain = Math.min(3.5, Math.max(0.06, (availWeak * 0.22 / totalCards) * 45));

                // 2. Leech / Blind-Spot Order — sized to wipe out all active leeches well before Feb 2027 (capped 3–6/day)
                const hasLeeches = td.activeLeeches > 0;
                const leechPaceNeed = Math.ceil(td.activeLeeches / Math.max(5, Math.min(18, td.safeRunwayDays * 0.30)));
                const leechTarget = hasLeeches
                    ? Math.max(3, Math.min(6, Math.min(td.activeLeeches, Math.round(Math.max(3, leechPaceNeed) * (th.leechScale || 1)))))
                    : 10;
                const estLeechGain = hasLeeches
                    ? Math.min(2.5, Math.max(0.08, ((leechTarget / Math.max(1, td.reviewedCards)) * 200 * 0.15) + (leechTarget * 0.22 / totalCards) * 45))
                    : 0.14;

                // 3. Sharpness / Coverage Order — unlocks New cards if Coverage <85% OR new cards piling up from intake rate; otherwise deliberate >=4s accurate reviews
                const newAvail = Math.max(0, td.total - td.reviewedCards);
                const needsCoverage = newAvail > 0 && (!td.gates.coverage85.pass || (td.intakeInfo.scopedIntakeRate >= 5 && newAvail >= 10));
                let sharpOrder;
                if (needsCoverage) {
                    const reqNewPace = Math.ceil((newAvail / Math.max(7, td.safeRunwayDays - 21)) + td.intakeInfo.scopedIntakeRate * 0.75);
                    const newTarget = Math.max(5, Math.min(35, Math.min(newAvail, Math.round(Math.max(reqNewPace, effectivePaceBase * 0.22) * (th.sharpnessScale || 1)))));
                    const estCovGain = Math.min(2.5, Math.max(0.08, (newTarget * 0.30 / totalCards) * 45));
                    sharpOrder = {
                        cat: 'sharpness',
                        mode: 'coverage',
                        title: `Unlock ${newTarget} New cards (keeps Coverage & +${td.intakeInfo.scopedIntakeRate}/d intake on Feb 2027 pace)`,
                        target: newTarget,
                        estGain: Number(estCovGain.toFixed(2))
                    };
                } else {
                    const delibTarget = Math.max(15, Math.min(45, Math.round(effectivePaceBase * 0.34 * (th.sharpnessScale || 1))));
                    sharpOrder = {
                        cat: 'sharpness',
                        mode: 'deliberate',
                        title: `Hit ${delibTarget} deliberate accurate reviews (≥4s/card • builds Clean Blocks)`,
                        target: delibTarget,
                        estGain: Number(Math.min(1.8, Math.max(0.16, delibTarget * 0.011)).toFixed(2))
                    };
                }

                tel.ordersSnapshot = {
                    version: 2,
                    scope: td.scope,
                    intakeTag,
                    dailyCap,
                    sureTopnotcherTodayQuota,
                    weakestName: td.weakestTarget.name,
                    weakestFolderIds: td.weakestTarget.folderIds,
                    orders: [
                        {
                            cat: 'mastery',
                            title: `Promote ${availWeak} L1–L2 cards in "${td.weakestTarget.name}"`,
                            target: availWeak,
                            estGain: Number(estMasteryGain.toFixed(2))
                        },
                        {
                            cat: 'leech',
                            title: hasLeeches
                                ? `Tame ${leechTarget} Active Leech${leechTarget > 1 ? 'es' : ''} to Level 3`
                                : `Answer 10 review cards cleanly (keep 0 new leeches)`,
                            target: leechTarget,
                            hasLeeches,
                            estGain: Number(estLeechGain.toFixed(2))
                        },
                        sharpOrder
                    ]
                };
                saveLocalTelemetryOnly();
            }

            // Compute live uncapped progress (for Overdrive / Bonus tracking!) for each of the 3 frozen orders
            const snap = tel.ordersSnapshot;
            const currentHour = new Date().getHours();
            const isLateDay = currentHour >= 18;
            let newlyCleared = false;

            const enriched = snap.orders.map(ord => {
                let rawProgress = 0;
                if (ord.cat === 'mastery') {
                    rawProgress = Math.max(tel.promotedWeakSubjectCards || 0, (tel.levelUps['1->2'] || 0) + (tel.levelUps['2->3'] || 0));
                } else if (ord.cat === 'leech') {
                    if (ord.hasLeeches) {
                        rawProgress = (tel.leechesTamed || 0);
                        if ((tel.leechSurgeriesDone || 0) > 0 && rawProgress < ord.target) {
                            rawProgress = Math.max(rawProgress, ord.target);
                        }
                    } else {
                        rawProgress = tel.clearedToday || 0;
                    }
                } else if (ord.cat === 'sharpness') {
                    if (ord.mode === 'coverage') rawProgress = tel.newCardsUnlocked || 0;
                    else rawProgress = tel.deliberateAccurateToday || 0;
                }
                const cleared = rawProgress >= ord.target;
                const bonus = Math.max(0, rawProgress - ord.target);
                const isOverdrive = bonus > 0;
                const isBeastMode = rawProgress >= ord.target * 2;
                const pctReal = Math.round((rawProgress / Math.max(1, ord.target)) * 100);
                const bonusEstGain = Number((ord.estGain * (Math.max(rawProgress, ord.target) / Math.max(1, ord.target))).toFixed(2));
                if (cleared && !tel.ordersClearedFlags[ord.cat]) {
                    tel.ordersClearedFlags[ord.cat] = true;
                    newlyCleared = true;
                }
                const status = isOverdrive ? 'overdrive' : cleared ? 'cleared' : (isLateDay && rawProgress > 0 ? 'partial_late' : isLateDay ? 'late_warn' : 'in_progress');
                const cand = getObjectiveCandidateCards(ord.cat, td);
                return {
                    ...ord,
                    progress: Math.min(rawProgress, ord.target),
                    rawProgress,
                    bonus,
                    isOverdrive,
                    isBeastMode,
                    pctReal,
                    bonusEstGain,
                    cleared,
                    status,
                    eligibleCount: cand.cards.length,
                    actionHint: cand.hint
                };
            });

            if (newlyCleared) {
                safeHaptic([30, 40, 50]);
                saveLocalTelemetryOnly();
            }

            // Yesterday recap (if exists)
            const yKey = getYesterdayDateKey();
            const yTel = state.dailyTelemetry && state.dailyTelemetry[yKey];
            let yesterdayRecap = null;
            if (yTel && yTel.ordersSnapshot && Array.isArray(yTel.ordersSnapshot.orders)) {
                const yFlags = yTel.ordersClearedFlags || {};
                const yItems = yTel.ordersSnapshot.orders.map(o => ({
                    ...o,
                    cleared: Boolean(yFlags[o.cat])
                }));
                yesterdayRecap = {
                    date: yKey,
                    clearedCount: yItems.filter(x => x.cleared).length,
                    total: yItems.length,
                    items: yItems
                };
            }

            const totalBonusCards = enriched.reduce((s, o) => s + o.bonus, 0);
            const daysAheadEarned = td.requiredDailyReviews > 0 ? +(totalBonusCards / td.requiredDailyReviews).toFixed(2) : 0;

            return {
                dailyCap: snap.dailyCap,
                sureTopnotcherTodayQuota: snap.sureTopnotcherTodayQuota || td.requiredDailyReviews,
                orders: enriched,
                clearedCount: enriched.filter(o => o.cleared).length,
                overdriveCount: enriched.filter(o => o.isOverdrive).length,
                totalBonusCards,
                daysAheadEarned,
                yesterdayRecap
            };
        }

        // Launch the EXACT card queue for a clicked Daily Objective!
        window.startObjectiveSession = (cat) => {
            const td = computeTopnotcherIndex();
            const ordInfo = getOrGenerateDailyOrders(td);
            const ord = ordInfo.orders.find(o => o.cat === cat);
            if (!ord) return;
            const cand = getObjectiveCandidateCards(cat, td);
            if (!cand.cards || cand.cards.length === 0) {
                showToast("No eligible cards left for this objective right now — awesome work! 🎉");
                return;
            }
            // Queue enough cards to finish remaining target + generous Overdrive bonus cards!
            const remaining = Math.max(0, ord.target - ord.rawProgress);
            const desiredCount = Math.min(cand.cards.length, Math.max(remaining + 12, Math.min(35, ord.target * 2)));
            const queue = cand.cards.slice(0, desiredCount);

            const startTopScore = td.score;
            sessionCardDurations = [];
            state.sessionLastImpact = null;
            if (cand.sessionType === 'leech_surgery') {
                state.timerEnabled = false; // Zero timer pressure for Leech taming!
            }
            state.sessionData = {
                type: cand.sessionType,
                queue,
                initialQueueLength: queue.length,
                startTopScore,
                tamedInSession: 0,
                answeredInSession: 0,
                objectiveCat: cat,
                objectiveTitle: ord.title
            };
            state.currentCardIndex = 0;
            state.timeLeft = state.timePerCard;
            initCardSessionState();
            window.setView('session');
            manageTimer();
            manageEtaInterval();
            const label = ord.cleared ? `🔥 Overdrive Mission started (${queue.length} bonus cards)` : `🎯 Objective Mission started (${queue.length} targeted cards)`;
            showToast(label);
        };

        // UI Action Helpers for Topnotcher, Intake Rate, Queue, Break Bank & Weekly Targets
        window.setTopnotcherScope = (scope) => {
            state.topnotcherScope = scope;
            saveLocalTelemetryOnly();
            renderApp();
        };
        window.setIntakeRateMode = (mode) => {
            state.intakeRateMode = mode === 'custom' ? 'custom' : 'auto';
            const tel = ensureDailyTelemetry();
            tel.ordersSnapshot = null;
            saveLocalTelemetryOnly();
            renderApp();
            showToast(mode === 'auto' ? "Card Intake Rate set to Auto (from History) 📈" : "Custom Card Intake Rate active");
        };
        window.setCustomIntakeRate = (val) => {
            state.intakeRateMode = 'custom';
            state.customIntakeRate = Math.max(0, Math.min(200, Number(val) || 0));
            const tel = ensureDailyTelemetry();
            tel.ordersSnapshot = null;
            saveLocalTelemetryOnly();
            renderApp();
            showToast(`Card Intake Rate set to +${state.customIntakeRate} cards/day 📈`);
        };
        window.toggleTopnotcherDisplayUnit = (event) => {
            if (event) event.stopPropagation();
            state.topnotcherDisplayUnit = state.topnotcherDisplayUnit === 'rp' ? 'pct' : 'rp';
            saveLocalTelemetryOnly();
            renderApp();
        };
        window.toggleHudStakesMode = (event) => {
            if (event) event.stopPropagation();
            state.hudStakesMode = state.hudStakesMode === 'stakes' ? 'clean' : 'stakes';
            saveLocalTelemetryOnly();
            renderApp();
        };
        window.setQueueMode = (mode) => {
            state.queueMode = mode;
            saveLocalTelemetryOnly();
            renderApp();
            showToast(mode === 'smart' ? "Smart Queue: Warm-Up + Interleaved Leeches 🎯" : "Queue: Classic Random Order");
        };
        window.toggleWeeklyTargetEditor = () => {
            state.showWeeklyTargetEditor = !state.showWeeklyTargetEditor;
            renderApp();
        };
        window.updateWeeklyTargetDay = (dow, val) => {
            const num = Math.max(10, Math.min(500, parseInt(val, 10) || 50));
            state.weeklyTargets[dow] = num;
            // Reset today's frozen order cap if user changes today's target
            const tel = ensureDailyTelemetry();
            tel.ordersSnapshot = null;
            saveLocalTelemetryOnly();
            renderApp();
        };
        window.toggleYesterdayOrders = () => {
            state.showYesterdayOrders = !state.showYesterdayOrders;
            renderApp();
        };
        window.claimBreakBank = () => {
            const tel = ensureDailyTelemetry();
            const available = Math.max(0, (tel.cleanBlocksEarned || 0) - (tel.breakBankClaimed || 0));
            if (available <= 0) return showToast("Finish a 15-min Clean Block (≥75% acc) to earn a Break!", "error");
            tel.breakBankClaimed = (tel.breakBankClaimed || 0) + 1;
            saveLocalTelemetryOnly();
            safeHaptic([40, 30, 40]);
            showToast("☕ Claimed 1 Clean Break! Stretch, hydrate, then come back sharp!");
            renderApp();
        };
        window.closeSessionSummaryModal = () => {
            state.sessionSummaryModal = null;
            renderApp();
        };

        // Feature 4: 5-Card Leech Surgery Mode (No timer pressure, top 5 active leeches!)
        window.startLeechSurgery = () => {
            const leeches = state.terms
                .filter(isActiveLeechCard)
                .sort((a, b) => (b.incorrect || 0) - (a.incorrect || 0))
                .slice(0, 5);
            if (leeches.length === 0) {
                showToast("Zero Active Leeches right now! Keep up the clean accuracy! 🎉");
                return;
            }
            const startTop = computeTopnotcherIndex().score;
            sessionCardDurations = [];
            state.sessionLastImpact = null;
            state.timerEnabled = false; // Zero timer pressure for deep dissection!
            state.sessionData = {
                type: 'leech_surgery',
                queue: leeches,
                initialQueueLength: leeches.length,
                startTopScore: startTop,
                tamedInSession: 0,
                answeredInSession: 0
            };
            state.currentCardIndex = 0;
            state.timeLeft = state.timePerCard;
            initCardSessionState();
            window.setView('session');
            manageTimer();
            manageEtaInterval();
            showToast(`🩺 Leech Surgery started (${leeches.length} cards • Timer OFF for deep dissection)`);
        };

        // --- SESSION LOGIC ---
        window.startSession = (type) => {
            const todayStart = getTodayStart();
            const targetFolderIds = getStudyFolderIds();
            const activeStudyTerms = targetFolderIds === null ? state.terms : state.terms.filter(t => targetFolderIds.includes(t.folderId));

            let queue = [];
            if (type === 'intake') {
                let newCards = activeStudyTerms.filter(t => t.isNew);
                shuffleArray(newCards);
                queue = newCards.slice(0, state.intakeSize);
            } else if (type === 'review') {
                let dueCards = activeStudyTerms.filter(t => !t.isNew && t.nextReviewDate <= todayStart);
                if (state.queueMode === 'smart') {
                    // Feature 3: Warm-Up (first 3 non-leech) + Interleaved Leeches (max 5 per 25-card window)
                    queue = buildSmartInterleavedQueue(dueCards);
                } else {
                    shuffleArray(dueCards);
                    dueCards.sort((a, b) => {
                        let weightA = (a.level <= 2) ? 1 : 2;
                        let weightB = (b.level <= 2) ? 1 : 2;
                        return weightA - weightB;
                    });
                    queue = dueCards;
                }
            } else if (type === 'review_ahead') {
                let futureCards = activeStudyTerms.filter(t => !t.isNew && t.nextReviewDate > todayStart && t.nextReviewDate <= todayStart + (state.lookAheadDays * MS_PER_DAY));
                shuffleArray(futureCards);
                queue = futureCards;
            } else if (type === 'parking_lot') {
                let parkedCards = state.terms.filter(t => t.parkingLot);
                shuffleArray(parkedCards);
                queue = parkedCards;
            } else if (type === 'erroneous') {
                let errCards = state.terms.filter(t => t.isErroneous);
                shuffleArray(errCards);
                queue = errCards;
            }

            if (queue.length === 0) {
                showToast("No cards available for this session.", "error");
                return;
            }

            const startTopScore = computeTopnotcherIndex().score;
            sessionCardDurations = [];
            state.sessionLastImpact = null;
            state.sessionData = {
                type,
                queue,
                initialQueueLength: queue.length,
                startTopScore,
                tamedInSession: 0,
                answeredInSession: 0
            };
            state.currentCardIndex = 0;
            state.timeLeft = state.timePerCard;
            initCardSessionState();
            window.setView('session');
            manageTimer();
            manageEtaInterval();
        };

        window.endSession = (completedNaturally = false) => {
            window.stopTTS(true);
            const finishedSession = state.sessionData;
            if (finishedSession && (finishedSession.type === 'leech_surgery' || (finishedSession.objectiveCat && (finishedSession.answeredInSession || 0) >= 1) || (completedNaturally && (finishedSession.answeredInSession || 0) >= 3))) {
                const endTopScore = computeTopnotcherIndex().score;
                const tel = ensureDailyTelemetry();
                if (finishedSession.type === 'leech_surgery' && completedNaturally) {
                    tel.leechSurgeriesDone = (tel.leechSurgeriesDone || 0) + 1;
                    saveLocalTelemetryOnly();
                }
                state.sessionSummaryModal = {
                    type: finishedSession.type,
                    answered: finishedSession.answeredInSession || 0,
                    tamed: finishedSession.tamedInSession || 0,
                    topDelta: endTopScore - (finishedSession.startTopScore ?? endTopScore),
                    endTopScore,
                    netLevelUpsToday: tel.levelUps?.net || 0,
                    leechesTamedToday: tel.leechesTamed || 0,
                    cleanBlocksToday: tel.cleanBlocksEarned || 0
                };
            }
            state.sessionData = null;
            state.sessionLastImpact = null;
            sessionCardDurations = [];
            clearInterval(timerInterval);
            clearInterval(etaRefreshInterval);
            window.logDailyStats();
            const returnView = finishedSession && finishedSession.objectiveCat
                ? 'topnotcher'
                : (finishedSession && finishedSession.type === 'leech_surgery' ? 'analytics' : 'dashboard');
            window.setView(returnView);
        };

        function recordActivityEvent(answerType, durationSec) {
            if (!state.activityLog || typeof state.activityLog !== 'object') state.activityLog = {};
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-CA'); // YYYY-MM-DD (local date)
            const hourStr = String(now.getHours()); // "0".."23"
            if (!state.activityLog[dateStr]) state.activityLog[dateStr] = {};
            if (!state.activityLog[dateStr][hourStr]) {
                state.activityLog[dateStr][hourStr] = { c: 0, w: 0, s: 0 };
            }
            const bucket = state.activityLog[dateStr][hourStr];
            if (answerType === 'wrong') bucket.w = (bucket.w || 0) + 1;
            else bucket.c = (bucket.c || 0) + 1;
            bucket.s = Math.round(((bucket.s || 0) + (Number(durationSec) || 8)) * 10) / 10;
        }

        window.handleAnswer = (answerType) => {
            window.stopTTS(true);
            const rawSec = currentCardStartTs > 0 ? (Date.now() - currentCardStartTs) / 1000 : 10;
            const clampedSec = Math.min(45, Math.max(1.5, rawSec));
            if (currentCardStartTs > 0) {
                sessionCardDurations.push(clampedSec);
                if (sessionCardDurations.length > 8) sessionCardDurations.shift();
            }

            const currentCard = state.sessionData.queue[state.currentCardIndex];
            const currentCorrect = currentCard.correct || 0;
            const currentIncorrect = currentCard.incorrect || 0;
            const todayStart = getTodayStart();

            // Snapshot BEFORE state for Top 1 counterfactuals, Daily Objectives diff, Leech clear & Locked-In detection
            const wasNew = Boolean(currentCard.isNew);
            const prevLevel = wasNew ? 0 : (currentCard.level || 1);
            const wasLeech = isActiveLeechCard(currentCard);
            const wasLocked = isLockedForFeb2027(currentCard);
            const stakes = simulateCardTop1Stakes(currentCard);
            const topBefore = stakes.baseScore;
            const ordersBeforeMap = {};
            getOrGenerateDailyOrders().orders.forEach(o => { ordersBeforeMap[o.cat] = o.rawProgress; });

            recordActivityEvent(answerType, clampedSec);

            // Compute next level / nextReviewDate
            let nextQueue = [...state.sessionData.queue];
            let newLevel = prevLevel;
            let newNextReview = currentCard.nextReviewDate || 0;
            let sessionFinishedNow = false;

            if (state.sessionData.type === 'intake') {
                if (answerType === 'perfect') {
                    newLevel = 4;
                    newNextReview = todayStart + (INTERVALS[4] * MS_PER_DAY);
                    updateTerm(currentCard.id, {
                        isNew: false,
                        level: 4,
                        nextReviewDate: newNextReview,
                        lastReviewedDate: Date.now(),
                        graduatedDate: currentCard.graduatedDate || Date.now(),
                        correct: currentCorrect + 1
                    });
                    nextQueue.splice(state.currentCardIndex, 1);
                    if (nextQueue.length === 0) sessionFinishedNow = true;
                } else if (answerType === 'correct') {
                    newLevel = 1;
                    newNextReview = todayStart + MS_PER_DAY;
                    updateTerm(currentCard.id, {
                        isNew: false,
                        level: 1,
                        nextReviewDate: newNextReview,
                        lastReviewedDate: Date.now(),
                        graduatedDate: currentCard.graduatedDate || Date.now(),
                        correct: currentCorrect + 1
                    });
                    nextQueue.splice(state.currentCardIndex, 1);
                    if (nextQueue.length === 0) sessionFinishedNow = true;
                } else {
                    newLevel = 0;
                    updateTerm(currentCard.id, { incorrect: currentIncorrect + 1 });
                    const cardToMove = nextQueue.splice(state.currentCardIndex, 1)[0];
                    nextQueue.push(cardToMove);
                }
                state.sessionData.queue = nextQueue;
            } else {
                if (answerType === 'perfect') {
                    newLevel = Math.min((currentCard.level || 1) + 3, 6);
                    newNextReview = todayStart + (INTERVALS[newLevel] * MS_PER_DAY);
                    updateTerm(currentCard.id, {
                        isNew: false,
                        level: newLevel,
                        nextReviewDate: newNextReview,
                        lastReviewedDate: Date.now(),
                        graduatedDate: currentCard.graduatedDate || Date.now(),
                        correct: currentCorrect + 1
                    });
                } else if (answerType === 'correct') {
                    newLevel = Math.min((currentCard.level || 1) + 1, 6);
                    newNextReview = todayStart + (INTERVALS[newLevel] * MS_PER_DAY);
                    updateTerm(currentCard.id, {
                        isNew: false,
                        level: newLevel,
                        nextReviewDate: newNextReview,
                        lastReviewedDate: Date.now(),
                        graduatedDate: currentCard.graduatedDate || Date.now(),
                        correct: currentCorrect + 1
                    });
                } else {
                    newLevel = 1;
                    newNextReview = todayStart + (INTERVALS[1] * MS_PER_DAY);
                    updateTerm(currentCard.id, {
                        isNew: false,
                        level: 1,
                        nextReviewDate: newNextReview,
                        lastReviewedDate: Date.now(),
                        graduatedDate: currentCard.graduatedDate || Date.now(),
                        incorrect: currentIncorrect + 1
                    });
                }

                if (state.currentCardIndex + 1 < state.sessionData.queue.length) {
                    state.currentCardIndex++;
                } else {
                    sessionFinishedNow = true;
                }
            }

            // --- Record Local Daily Telemetry (Features 5, 6, 7, 8, 9, 11 — Zero Extra Firestore Writes!) ---
            const tel = ensureDailyTelemetry();
            state.sessionData.answeredInSession = (state.sessionData.answeredInSession || 0) + 1;

            // Pace Bracket (<4s, 4-8s, 8-15s, >15s)
            const bKey = rawSec < 4 ? 'b1' : rawSec < 8 ? 'b2' : rawSec <= 15 ? 'b3' : 'b4';
            if (answerType === 'wrong') tel.paceBrackets[bKey].w = (tel.paceBrackets[bKey].w || 0) + 1;
            else tel.paceBrackets[bKey].c = (tel.paceBrackets[bKey].c || 0) + 1;

            // Queue Efficiency (forward vs loopback into L1-L2) & Deliberate Sharpness (>=4s accurate)
            if (answerType !== 'wrong') {
                tel.forwardAns = (tel.forwardAns || 0) + 1;
                tel.clearedToday = (tel.clearedToday || 0) + 1;
                if (rawSec >= 4) {
                    tel.deliberateAccurateToday = (tel.deliberateAccurateToday || 0) + 1;
                }
            } else {
                tel.loopbackAns = (tel.loopbackAns || 0) + 1;
            }

            // Smart Leech Objective Re-Queue: if L1 leech was promoted to L2 inside Order #2, re-queue 2 cards ahead so you can finish taming it to L3!
            if (state.sessionData.objectiveCat === 'leech' && wasLeech && prevLevel === 1 && answerType === 'correct' && newLevel === 2) {
                const updatedL2 = state.terms.find(t => t.id === currentCard.id);
                if (updatedL2) {
                    const insertAt = Math.min(state.sessionData.queue.length, state.currentCardIndex + 2);
                    state.sessionData.queue.splice(insertAt, 0, { ...updatedL2 });
                    sessionFinishedNow = false;
                    showToast("🎯 L1→L2! Re-queued in 2 cards — 1 more Tama to Tame to L3!");
                }
            }

            // Micro-Wins: Level-Ups & Breakdown
            if (answerType !== 'wrong' && newLevel > prevLevel) {
                tel.levelUps.net = (tel.levelUps.net || 0) + (newLevel - prevLevel);
                const transKey = `${prevLevel}->${Math.min(prevLevel + 1, 6)}`;
                if (tel.levelUps[transKey] !== undefined) tel.levelUps[transKey]++;
                if (wasNew) tel.newCardsUnlocked = (tel.newCardsUnlocked || 0) + 1;
                // Track promotion of weakest subject/folder L1-L2 cards for Daily Order #1
                if (prevLevel >= 1 && prevLevel <= 2) {
                    const wf = tel.ordersSnapshot && tel.ordersSnapshot.weakestFolderIds;
                    if (!wf || wf.includes(currentCard.folderId)) {
                        tel.promotedWeakSubjectCards = (tel.promotedWeakSubjectCards || 0) + 1;
                    }
                }
            } else if (answerType === 'wrong' && prevLevel > 1) {
                tel.levelUps.net = (tel.levelUps.net || 0) - (prevLevel - 1);
            }

            // Leech Tamed & Post-Feb 2027 Locked-In checks
            const updatedCardObj = state.terms.find(t => t.id === currentCard.id);
            const nowLeech = isActiveLeechCard(updatedCardObj);
            const nowLocked = isLockedForFeb2027(updatedCardObj);
            const leechClearedToL3 = wasLeech && answerType !== 'wrong' && newLevel >= 3;
            const newlyLocked = !wasLocked && nowLocked;

            if (leechClearedToL3) {
                tel.leechesTamed = (tel.leechesTamed || 0) + 1;
                state.sessionData.tamedInSession = (state.sessionData.tamedInSession || 0) + 1;
            }
            if (newlyLocked) {
                tel.lockedToday = (tel.lockedToday || 0) + 1;
            }

            // Feature 7: 15-Minute Clean Block -> Break Bank (900 active clamped seconds @ >=75% acc)
            tel.cleanBlockSec = Math.round(((tel.cleanBlockSec || 0) + clampedSec) * 10) / 10;
            if (answerType === 'wrong') tel.cleanBlockW = (tel.cleanBlockW || 0) + 1;
            else tel.cleanBlockC = (tel.cleanBlockC || 0) + 1;
            if (tel.cleanBlockSec >= 900) {
                const blkTot = (tel.cleanBlockC || 0) + (tel.cleanBlockW || 0);
                const blkAcc = blkTot > 0 ? (tel.cleanBlockC / blkTot) * 100 : 100;
                if (blkAcc >= 75) {
                    tel.cleanBlocksEarned = (tel.cleanBlocksEarned || 0) + 1;
                    showToast(`🧱 +1 Clean Block Earned (${Math.round(blkAcc)}% acc)! Break Bank +1 ☕`);
                    safeHaptic([40, 30, 55]);
                } else {
                    showToast(`15m block ended at ${Math.round(blkAcc)}% acc (need ≥75% for Break Bank). Fresh block started!`, "error");
                }
                tel.cleanBlockSec = 0;
                tel.cleanBlockC = 0;
                tel.cleanBlockW = 0;
            }

            // Evaluate Daily Orders progress & trigger sleek compact right-side popups for every objective that moved up (+1 / Cleared / Overdrive!)
            const ordersAfterInfo = getOrGenerateDailyOrders();
            ordersAfterInfo.orders.forEach(ord => {
                const beforeVal = ordersBeforeMap[ord.cat] || 0;
                if (ord.rawProgress > beforeVal) {
                    triggerObjectiveSidePopup(ord, ord.rawProgress - beforeVal, beforeVal, ord.rawProgress);
                }
            });
            saveLocalTelemetryOnly();

            // --- Feature 2: Live Top 1 Impact Delta + Game Animations & Haptics ---
            const topAfter = computeTopnotcherIndex().score;
            const actualDelta = topAfter - topBefore;
            const isRushedMiss = answerType === 'wrong' && rawSec < 3.5;

            let fxType = 'emerald';
            let extraLabel = '';
            if (answerType !== 'wrong') {
                if (leechClearedToL3) {
                    fxType = 'gold';
                    extraLabel = 'NEMESIS CLEARED!';
                    showToast("⚡ NEMESIS CLEARED! Active Leech graduated to Level 3! 🏆");
                } else if (newlyLocked) {
                    fxType = 'gold';
                    extraLabel = 'LOCKED FEB 2027!';
                    showToast("🔒 LOCKED IN FOR FEB 2027! Card mastered past exam date!");
                } else {
                    fxType = 'emerald';
                }
            } else {
                if (isRushedMiss) {
                    fxType = 'rushed';
                    extraLabel = '<3.5s Slow down!';
                } else if (wasLeech || nowLeech) {
                    fxType = 'crit_miss';
                    extraLabel = 'LEECH ACTIVE';
                } else {
                    fxType = 'miss';
                }
            }

            const counterfactualVal = answerType !== 'wrong' ? stakes.lossWrong : stakes.gainCorrect;
            state.sessionLastImpact = {
                delta: actualDelta,
                counterfactual: counterfactualVal,
                isCorrect: answerType !== 'wrong',
                isRushed: isRushedMiss,
                fxType,
                extraLabel,
                sessionTotalDelta: topAfter - (state.sessionData.startTopScore ?? topAfter)
            };

            triggerTop1FeedbackFX(fxType, actualDelta, extraLabel);

            if (sessionFinishedNow) {
                return window.endSession(true);
            }

            state.timeLeft = state.timePerCard;
            initCardSessionState();
            renderApp();
            manageTimer();
        };

        function updateTerm(id, updates) {
            state.terms = state.terms.map(t => t.id === id ? { ...t, ...updates } : t);
            if (state.sessionData && Array.isArray(state.sessionData.queue)) {
                state.sessionData.queue = state.sessionData.queue.map(t => t.id === id ? { ...t, ...updates } : t);
            }
            saveData();
        }

        function manageTimer() {
            clearInterval(timerInterval);
            if (state.currentView !== 'session' || !state.sessionData || state.editingTermId) return;
            
            if (state.timerEnabled && !state.showAnswer) {
                timerInterval = setInterval(() => {
                    if (state.timeLeft > 0) {
                        state.timeLeft--;

        function extractFallbackKeywords(stemText) {
            const clean = String(stemText || '').replace(/^\d+\.\s*/, '').trim();
            const stopWords = new Set(['which', 'following', 'what', 'when', 'where', 'that', 'this', 'these', 'those', 'from', 'with', 'into', 'under', 'over', 'between', 'usually', 'often', 'called', 'known', 'termed', 'about', 'have', 'been', 'would', 'should', 'could', 'their', 'there', 'other']);
            const words = clean.match(/[A-Za-z][A-Za-z0-9-]{3,}/g) || [];
            const candidates = [];
            for (const w of words) {
                const lw = w.toLowerCase();
                if (!stopWords.has(lw) && !candidates.some(c => c.toLowerCase() === lw)) {
                    candidates.push(w);
                }
                if (candidates.length >= 3) break;
            }
            return candidates;
        }

        function repairLatexInJsonString(jsonStr) {
            return String(jsonStr || '').replace(/\\(\\|"|\/|u[0-9a-fA-F]{4}|(?:frac|theta|tau|times|text|tan|rho|right|beta|bar|begin|nu|nabla|neq|ne|approx|alpha|gamma|delta|Delta|sigma|Sigma|omega|Omega|eta|mu|lambda|pi|phi|Phi|psi|epsilon|varepsilon|cdot|cdots|pm|mp|sqrt|sum|int|left|leq|geq|le|ge|circ|degree|infty|partial|propto|to|rightarrow|leftarrow|quad|qquad|mathbf|mathrm|mathit|vec|hat|dot|ddot|overline|underline|end|cos|sin|log|ln|exp|lim)\b|[^"\\/bfnrtu])/g, (match, next) => {
                if (next === '\\' || next === '"' || next === '/' || /^u[0-9a-fA-F]{4}$/.test(next)) {
                    return match;
                }
                return '\\\\' + next;
            });
        }

        function normalizeLatexText(text) {
            return String(text || '')
                .replace(/\f(rac\b)/g, '\\f$1')
                .replace(/\t(au\b|heta\b|imes\b|ext\b|an\b)/g, '\\t$1')
                .replace(/\r(ho\b|ight\b)/g, '\\r$1')
                .replace(/\x08(eta\b|ar\b|egin\b)/g, '\\b$1');
        }

        function renderFormattedNotesHtml(text) {
            const raw = normalizeLatexText(text || '').trim();
            if (!raw) {
                return `<p class="text-xs italic text-purple-400">Wala pang notes. Pindutin ang "Edit" para mag-type o magtanong sa chat box sa baba.</p>`;
            }
            const mathSplitRegex = /(\$\$[\s\S]*?\$\$|\$[^$\n]+\$|\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\])/g;
            const segments = raw.split(mathSplitRegex);

            return segments.map(seg => {
                if (!seg) return '';
                if (seg.startsWith('$$') && seg.endsWith('$$')) {
                    const expr = seg.slice(2, -2).trim();
                    if (window.katex && window.katex.renderToString) {
                        try { return window.katex.renderToString(expr, { displayMode: true, throwOnError: false }); } catch (e) {}
                    }
                    return escapeHTML(seg);
                }
                if (seg.startsWith('\\[') && seg.endsWith('\\]')) {
                    const expr = seg.slice(2, -2).trim();
                    if (window.katex && window.katex.renderToString) {
                        try { return window.katex.renderToString(expr, { displayMode: true, throwOnError: false }); } catch (e) {}
                    }
                    return escapeHTML(seg);
                }
                if ((seg.startsWith('$') && seg.endsWith('$')) || (seg.startsWith('\\(') && seg.endsWith('\\)'))) {
                    const expr = seg.startsWith('$') ? seg.slice(1, -1).trim() : seg.slice(2, -2).trim();
                    if (window.katex && window.katex.renderToString) {
                        try { return window.katex.renderToString(expr, { displayMode: false, throwOnError: false }); } catch (e) {}
                    }
                    return escapeHTML(seg);
                }
                let html = escapeHTML(seg);
                // Render horizontal separator lines between accumulative Q&A entries
                html = html.replace(/(?:^|\n)---(?:\n|$)/g, '<hr class="my-2.5 border-purple-200/90" />');
                // Highlight Q: and A: prefixes cleanly
                html = html.replace(/(^|\n)\*\*Q:\*\*\s*/g, '$1<span class="inline-block text-[10px] font-black uppercase tracking-wider bg-purple-200/80 text-purple-900 px-1.5 py-0.5 rounded mr-1">Q</span>');
                html = html.replace(/(^|\n)\*\*A:\*\*\s*/g, '$1<span class="inline-block text-[10px] font-black uppercase tracking-wider bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded mr-1">A</span>');
                // Basic bold & inline code formatting outside LaTeX
                html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong class="font-extrabold text-purple-950">$1</strong>');
                html = html.replace(/`([^`\n]+)`/g, '<code class="px-1 py-0.5 bg-purple-100/80 rounded font-mono text-xs">$1</code>');
                return html;
            }).join('');
        }

        function pickBestBrowserVoice(preferTaglish = true) {
            const voices = refreshBrowserVoices();
            if (!voices || voices.length === 0) return null;

            if (state.ttsVoiceName && state.ttsVoiceName !== 'auto') {
                const exact = voices.find(v => v.name === state.ttsVoiceName);
                if (exact) return exact;
            }

            const scoreVoice = (v) => {
                const name = String(v.name || '').toLowerCase();
                const lang = String(v.lang || '').toLowerCase();
                let s = 0;
                const isFil = lang.startsWith('fil') || lang.startsWith('tl') || name.includes('filipino') || name.includes('tagalog') || name.includes('blessica') || name.includes('angelo');
                const isEnPh = lang === 'en-ph' || name.includes('rosa') || name.includes('james');
                const isNatural = name.includes('natural') || name.includes('online') || name.includes('neural') || name.includes('google') || name.includes('enhanced');

                if (preferTaglish) {
                    if (name.includes('blessica') || name.includes('angelo')) s += 500; // Edge Neural Filipino voices!
                    else if (isFil && isNatural) s += 420;
                    else if (isFil) s += 360;
                    else if (isEnPh && isNatural) s += 280;
                    else if (isEnPh) s += 220;
                    else if (lang.startsWith('en') && isNatural) s += 160;
                    else if (lang.startsWith('en')) s += 100;
                } else {
                    if (isEnPh && isNatural) s += 400;
                    else if (lang.startsWith('en-us') && isNatural) s += 360;
                    else if (isFil && isNatural) s += 330;
                    else if (lang.startsWith('en') && isNatural) s += 280;
                    else if (lang.startsWith('en')) s += 180;
                    else if (isFil) s += 150;
                }
                return s;
            };

            return [...voices].sort((a, b) => scoreVoice(b) - scoreVoice(a))[0] || voices[0];
        }

        // IndexedDB Local Audio Cache for Cloud/Azure MP3 blobs (0 repeat characters used!)
        function openTtsAudioDb() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) return resolve(null);
                const req = indexedDB.open('ElementVaultTtsAudio', 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains('clips')) db.createObjectStore('clips');
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        async function ttsAudioDbGet(key) {
            try {
                const db = await openTtsAudioDb();
                if (!db) return null;
                return await new Promise(resolve => {
                    const tx = db.transaction('clips', 'readonly');
                    const r = tx.objectStore('clips').get(key);
                    r.onsuccess = () => resolve(r.result || null);
                    r.onerror = () => resolve(null);
                });
            } catch (e) { return null; }
        }

        async function ttsAudioDbPut(key, blob) {
            try {
                const db = await openTtsAudioDb();
                if (!db) return;
                await new Promise(resolve => {
                    const tx = db.transaction('clips', 'readwrite');
                    tx.objectStore('clips').put(blob, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                });
            } catch (e) {}
        }

        function hashTtsKey(str) {
            let h = 2166136261;
            const s = String(str || '');
            for (let i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return (h >>> 0).toString(36);
        }

        // Built-in ME / LaTeX / Number-to-Words Local TTS Cleaner (0 quota, instant fallback)
        function intToEnglishWords(n) {
            const num = parseInt(n, 10);
            if (isNaN(num) || num < 0 || num > 9999) return String(n);
            const ones = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
            const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
            if (num < 20) return ones[num];
            if (num < 100) return tens[Math.floor(num / 10)] + (num % 10 ? ' ' + ones[num % 10] : '');
            if (num < 1000) return ones[Math.floor(num / 100)] + ' hundred' + (num % 100 ? ' ' + intToEnglishWords(num % 100) : '');
            return ones[Math.floor(num / 1000)] + ' thousand' + (num % 1000 ? ' ' + intToEnglishWords(num % 1000) : '');
        }

        function localCleanForTTS(raw) {
            let s = normalizeLatexText(raw || '');
            // Strip markdown formatting
            s = s.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/---+/g, '. ');
            // Remove leading question numbering like "123."
            s = s.replace(/^\s*\d+\.\s*/, '');
            // Convert common LaTeX constructs into natural speech
            s = s.replace(/\$\$|\$|\\\(|\\\)|\\\[|\\\]/g, ' ');
            s = s.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '$1 over $2');
            s = s.replace(/\\sqrt\{([^}]+)\}/g, 'square root of $1');
            s = s.replace(/\\text\{([^}]+)\}/g, '$1').replace(/\\mathrm\{([^}]+)\}/g, '$1').replace(/\\mathbf\{([^}]+)\}/g, '$1');
            s = s.replace(/\^2\b/g, ' squared').replace(/\^3\b/g, ' cubed').replace(/\^\{2\}/g, ' squared').replace(/\^\{3\}/g, ' cubed');
            s = s.replace(/\^\{([^}]+)\}/g, ' to the power of $1');
            s = s.replace(/_\{([^}]+)\}/g, ' $1').replace(/_([A-Za-z0-9])/g, ' $1');
            // Greek & math commands
            const latexMap = {
                '\\eta': 'eta', '\\tau': 'tau', '\\sigma': 'sigma', '\\theta': 'theta', '\\rho': 'rho',
                '\\pi': 'pi', '\\alpha': 'alpha', '\\beta': 'beta', '\\gamma': 'gamma', '\\omega': 'omega',
                '\\Delta': 'delta', '\\delta': 'delta', '\\mu': 'mu', '\\lambda': 'lambda', '\\phi': 'phi',
                '\\times': 'times', '\\cdot': 'times', '\\pm': 'plus or minus', '\\approx': 'approximately',
                '\\neq': 'not equal to', '\\leq': 'less than or equal to', '\\geq': 'greater than or equal to',
                '\\circ': 'degrees', '\\degree': 'degrees', '\\infty': 'infinity', '\\left': '', '\\right': ''
            };
            Object.keys(latexMap).forEach(k => {
                s = s.split(k).join(' ' + latexMap[k] + ' ');
            });
            s = s.replace(/\\[A-Za-z]+/g, ' ').replace(/[{}]/g, ' ');
            // Common ME units & symbols
            s = s.replace(/°\s*C\b/gi, ' degrees Celsius').replace(/°\s*F\b/gi, ' degrees Fahrenheit').replace(/°/g, ' degrees');
            s = s.replace(/\bMPa\b/g, 'megapascals').replace(/\bkPa\b/g, 'kilopascals').replace(/\bGPa\b/g, 'gigapascals');
            s = s.replace(/\bkW\b/g, 'kilowatts').replace(/\bMW\b/g, 'megawatts').replace(/\bkJ\b/g, 'kilojoules');
            s = s.replace(/\bkN\b/g, 'kilonewtons').replace(/\brpm\b/gi, 'R P M').replace(/\bpsi\b/gi, 'P S I');
            s = s.replace(/\bm\/s\b/g, 'meters per second').replace(/\bkg\/m3\b/gi, 'kilograms per cubic meter');
            s = s.replace(/>=/g, ' greater than or equal to ').replace(/<=/g, ' less than or equal to ').replace(/!=/g, ' not equal to ');
            s = s.replace(/\s*\+\s*/g, ' plus ').replace(/=/g, ' equals ').replace(/%/g, ' percent ').replace(/—|--/g, ', ').replace(/[•·]/g, ', ');
            // Convert standalone integers (0-9999) into clean English spoken words (e.g. 30 -> thirty)
            s = s.replace(/\b(\d{1,4})\b/g, (m, digits) => intToEnglishWords(digits));
            return s.replace(/\s+/g, ' ').trim();
        }

        function updateTtsButtonState(newState) {
            state.ttsState = newState;
            const btn = document.getElementById('session-tts-btn');
            if (!btn) return;

        window.stopTTS = (silent = false) => {

        // Step 1: Prepare & Cache Invisible Spoken TTS Script (Separate for 'orig' vs 'taglish'!)
        async function prepareTtsScriptForCard(termId, mode) {
            const term = state.terms.find(t => t.id === termId);
            if (!term) return null;

            const cacheField = mode === 'taglish' ? 'ttsScriptTaglish' : 'ttsScriptOrig';
            if (term[cacheField] && term[cacheField].stem) {
                return term[cacheField];
            }

            const { stem: origStem, parsedChoices } = parseQuestionAndChoices(term.question);
            const hasParsedChoices = Array.isArray(parsedChoices) && parsedChoices.length > 0;

            let sourceStem = origStem;
            let sourceChoicesMap = {};
            if (hasParsedChoices) {
                parsedChoices.forEach(c => { sourceChoicesMap[c.origLetter] = c.text; });
            }

            if (mode === 'taglish' && term.taglishSimplified && term.taglishSimplified.stem) {
                sourceStem = term.taglishSimplified.stem;
                if (hasParsedChoices) {
                    const tc = term.taglishSimplified.choices || {};
                    parsedChoices.forEach(c => {
                        sourceChoicesMap[c.origLetter] = tc[c.origLetter] || c.text;
                    });
                }
            }

            // Build instant local fallback first
            const buildLocalFallback = () => {
                const cMap = {};
                Object.keys(sourceChoicesMap).forEach(k => {
                    cMap[k] = localCleanForTTS(sourceChoicesMap[k]);
                });
                return { stem: localCleanForTTS(sourceStem), choices: cMap };
            };

            // Optional Step 1 AI TTS-Script Polish (uses fast 500-14.4K RPD text AI & caches permanently on the card!)
            if (state.ttsUseAiPolish && (state.geminiApiKey || '').trim()) {
                const choicesPromptLines = Object.keys(sourceChoicesMap)
                    .map(k => `${k}: ${sourceChoicesMap[k]}`)
                    .join('\n');

                const systemPrompt = `You convert flashcard text into an EXACT, clean spoken script for Text-to-Speech (TTS).
Rules:
1. Keep the EXACT language and meaning (${mode === 'taglish' ? 'natural conversational Taglish — keep Tagalog words natural and English technical words/numbers in clear English' : 'clear spoken English'}).
2. Convert ALL raw syntax, LaTeX math, symbols, units, fractions, exponents, and numbers into natural spoken words (numbers in English words like "thirty", "zero point twenty-five", "twenty-five degrees Celsius", "Z equals the square root of R squared plus X squared").
3. Remove ALL markdown (**bold**, backticks, dashes, brackets, slashes, underscores, question numbers like "12.").
4. Use smooth commas and periods for natural breathing pauses. NEVER add explanations, opinions, or spoilers.
Respond ONLY with valid JSON: {"stem": "...", "choices": {"A": "...", "B": "...", "C": "...", "D": "..."}}`;

                const userQuery = `Question Stem:\n${sourceStem}${choicesPromptLines ? `\n\nChoices (keep exact keys A, B, C, D):\n${choicesPromptLines}` : ''}`;

                try {
                    const raw = await callGeminiAPI(systemPrompt, userQuery, true);
                    if (raw) {
                        const jsonMatch = raw.match(/\{[\s\S]*\}/);
                        const parsed = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
                        if (parsed && parsed.stem) {
                            const cleanedChoices = {};
                            if (parsed.choices && typeof parsed.choices === 'object') {
                                Object.keys(parsed.choices).forEach(k => {
                                    const ck = String(k).trim().toUpperCase().replace(/[^A-D]/g, '');
                                    if (ck && parsed.choices[k]) cleanedChoices[ck] = String(parsed.choices[k]).trim();
                                });
                            }
                            const resultObj = { stem: String(parsed.stem).trim(), choices: cleanedChoices };
                            updateTerm(termId, { [cacheField]: resultObj });
                            return resultObj;
                        }
                    }
                } catch (e) {}
            }

            const localObj = buildLocalFallback();
            updateTerm(termId, { [cacheField]: localObj });
            return localObj;
        }

        // Speak using Free Unlimited Phone/Browser SpeechSynthesis (chunked to prevent Android 15s cutoff!)
        function speakWithBrowserTTS(segments, preferTaglish, myRunId) {
            if (!('speechSynthesis' in window)) {
                showToast("Hindi supported ang voice playback sa browser na ito.", "error");
                updateTtsButtonState('idle');
                return;
            }
            window.speechSynthesis.cancel();
            const chosenVoice = pickBestBrowserVoice(preferTaglish);
            const rate = Math.min(1.6, Math.max(0.7, Number(state.ttsRate) || 1.05));

            // Split long strings into ~160-char sentence chunks so mobile Chrome never cuts off mid-sentence
            const chunks = [];
            segments.forEach(seg => {
                const text = String(seg || '').trim();
                if (!text) return;
                if (text.length <= 160) {
                    chunks.push(text);
                } else {
                    const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
                    parts.forEach(p => { if (p.trim()) chunks.push(p.trim()); });
                }
            });

            if (chunks.length === 0) {
                updateTtsButtonState('idle');
                return;
            }

            updateTtsButtonState('speaking');
            let idx = 0;

            const speakNext = () => {
                if (myRunId !== ttsRunId) return;
                if (idx >= chunks.length) {
                    updateTtsButtonState('idle');
                    return;
                }
                const utt = new SpeechSynthesisUtterance(chunks[idx]);
                if (chosenVoice) {
                    utt.voice = chosenVoice;
                    utt.lang = chosenVoice.lang;
                } else {
                    utt.lang = preferTaglish ? 'fil-PH' : 'en-US';
                }
                utt.rate = rate;
                utt.pitch = 1.0;
                utt.onend = () => {
                    idx++;
                    speakNext();
                };
                utt.onerror = () => {
                    if (myRunId === ttsRunId) updateTtsButtonState('idle');
                };
                window.speechSynthesis.speak(utt);
            };

            speakNext();
        }

        async function playBlobAudio(blob, myRunId) {
            if (myRunId !== ttsRunId) return;
            const url = URL.createObjectURL(blob);
            if (!activeTtsAudio) activeTtsAudio = new Audio();
            activeTtsAudio.src = url;
            activeTtsAudio.playbackRate = Math.min(1.6, Math.max(0.7, Number(state.ttsRate) || 1.05));
            activeTtsAudio.onended = () => {
                URL.revokeObjectURL(url);
                if (myRunId === ttsRunId) updateTtsButtonState('idle');
            };
            activeTtsAudio.onerror = () => {
                URL.revokeObjectURL(url);
                if (myRunId === ttsRunId) updateTtsButtonState('idle');
            };
            updateTtsButtonState('speaking');
            await activeTtsAudio.play();
        }

        function pcmToWavBlob(pcmBytes, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) {
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const buffer = new ArrayBuffer(44 + pcmBytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + pcmBytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeStr(36, 'data');
            view.setUint32(40, pcmBytes.length, true);
            new Uint8Array(buffer, 44).set(pcmBytes);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function speakTextEngine(segments, preferTaglish, cachePrefix, myRunId) {
            if (myRunId !== ttsRunId) return;
            const fullText = segments.filter(Boolean).join('. ... ');
            if (!fullText.trim()) {
                updateTtsButtonState('idle');
                return;
            }

            // 0. Optional Gemini Native Audio TTS (Same Gemini Key! Studio Taglish + Local IndexedDB Audio Cache)
            if (state.ttsEngine === 'gemini') {
                const gKeys = (state.geminiApiKey || '').split(/[\n,]+/).map(k => k.trim()).filter(k => k.startsWith('AIza'));
                if (gKeys.length > 0) {
                    const voiceId = ['Kore', 'Puck', 'Aoede', 'Zephyr', 'Charon', 'Fenrir'].includes(state.ttsVoiceName)
                        ? state.ttsVoiceName
                        : 'Kore';
                    const cacheKey = `gem_${cachePrefix}_${voiceId}_${hashTtsKey(fullText)}`;
                    const cachedBlob = await ttsAudioDbGet(cacheKey);
                    if (cachedBlob && myRunId === ttsRunId) {
                        try { await playBlobAudio(cachedBlob, myRunId); return; } catch (e) {}
                    }
                    const ttsModelsToTry = ['gemini-2.5-flash-preview-tts'];
                    let gemErr = '';
                    for (const gKey of gKeys) {
                        for (const ttsModel of ttsModelsToTry) {
                            try {
                                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${ttsModel}:generateContent?key=${gKey}`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        contents: [{ parts: [{ text: `Read aloud clearly and naturally in ${preferTaglish ? 'conversational Taglish' : 'clear English'}:\n\n${fullText}` }] }],
                                        generationConfig: {
                                            responseModalities: ['AUDIO'],
                                            speechConfig: {
                                                voiceConfig: {
                                                    prebuiltVoiceConfig: { voiceName: voiceId }
                                                }
                                            }
                                        }
                                    })
                                });
                                if (res.ok && myRunId === ttsRunId) {
                                    const data = await res.json();
                                    const inline = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData;
                                    if (inline && inline.data) {
                                        const bin = atob(inline.data);
                                        const bytes = new Uint8Array(bin.length);
                                        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                                        const mime = String(inline.mimeType || '').toLowerCase();
                                        let blob;
                                        if (mime.includes('pcm') || mime.includes('l16') || !mime) {
                                            const rateMatch = mime.match(/rate=(\d+)/);
                                            blob = pcmToWavBlob(bytes, rateMatch ? parseInt(rateMatch[1], 10) : 24000);
                                        } else {
                                            blob = new Blob([bytes], { type: mime });
                                        }
                                        ttsAudioDbPut(cacheKey, blob);
                                        await playBlobAudio(blob, myRunId);
                                        return;
                                    }
                                } else {
                                    const eb = await res.json().catch(() => ({}));
                                    gemErr = eb.error?.message || `HTTP ${res.status}`;
                                }
                            } catch (e) {
                                gemErr = e.message;
                            }
                        }
                    }
                    showToast(`Gemini TTS limit/unavailable (${gemErr.slice(0, 45)}) -> Fallback voice 🔊`, "error");
                }
            }

            // 1. Optional Google Cloud TTS (1M Neural2 / 4M WaveNet chars/mo FREE) + IndexedDB Audio Cache
            if (state.ttsEngine === 'gcloud') {
                const gKey = (state.ttsCloudApiKey || '').trim() || (state.geminiApiKey || '').split(/[\n,]+/).map(k => k.trim()).find(k => k.startsWith('AIza'));
                if (gKey) {
                    const voiceId = (state.ttsVoiceName && state.ttsVoiceName.startsWith('fil-PH'))
                        ? state.ttsVoiceName
                        : 'fil-PH-Neural2-A';
                    const cacheKey = `gc_${cachePrefix}_${voiceId}_${hashTtsKey(fullText)}`;
                    const cachedBlob = await ttsAudioDbGet(cacheKey);
                    if (cachedBlob && myRunId === ttsRunId) {
                        try { await playBlobAudio(cachedBlob, myRunId); return; } catch (e) {}
                    }
                    try {
                        const res = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${gKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                input: { text: fullText },
                                voice: { languageCode: 'fil-PH', name: voiceId },
                                audioConfig: { audioEncoding: 'MP3', speakingRate: Math.min(1.5, Math.max(0.75, Number(state.ttsRate) || 1.05)) }
                            })
                        });
                        if (res.ok && myRunId === ttsRunId) {
                            const data = await res.json();
                            if (data.audioContent) {
                                const bin = atob(data.audioContent);
                                const bytes = new Uint8Array(bin.length);
                                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                                const blob = new Blob([bytes], { type: 'audio/mp3' });
                                ttsAudioDbPut(cacheKey, blob);
                                await playBlobAudio(blob, myRunId);
                                return;
                            }
                        }
                    } catch (e) {}
                    showToast("Google Cloud TTS unavailable -> Switched to Free Phone Voice 🔊", "error");
                }
            }

            // 2. Optional Azure Speech Free Tier F0 (500k Neural chars/mo FREE — Blessica / Angelo) + IndexedDB Audio Cache
            if (state.ttsEngine === 'azure') {
                const azKey = (state.ttsCloudApiKey || '').trim();
                const azRegion = (state.ttsAzureRegion || 'southeastasia').trim();
                if (azKey) {
                    const voiceId = (state.ttsVoiceName && state.ttsVoiceName.startsWith('fil-PH'))
                        ? state.ttsVoiceName
                        : 'fil-PH-BlessicaNeural';
                    const cacheKey = `az_${cachePrefix}_${voiceId}_${hashTtsKey(fullText)}`;
                    const cachedBlob = await ttsAudioDbGet(cacheKey);
                    if (cachedBlob && myRunId === ttsRunId) {
                        try { await playBlobAudio(cachedBlob, myRunId); return; } catch (e) {}
                    }
                    try {
                        const safeSsmlText = fullText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        const ssml = `<speak version='1.0' xml:lang='fil-PH'><voice name='${voiceId}'>${safeSsmlText}</voice></speak>`;
                        const res = await fetch(`https://${azRegion}.tts.speech.microsoft.com/cognitiveservices/v1`, {
                            method: 'POST',
                            headers: {
                                'Ocp-Apim-Subscription-Key': azKey,
                                'Content-Type': 'application/ssml+xml',
                                'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3'
                            },
                            body: ssml
                        });
                        if (res.ok && myRunId === ttsRunId) {
                            const blob = await res.blob();
                            ttsAudioDbPut(cacheKey, blob);
                            await playBlobAudio(blob, myRunId);
                            return;
                        }
                    } catch (e) {}
                    showToast("Azure Speech unavailable -> Switched to Free Phone Voice 🔊", "error");
                }
            }

            // 3. Default / Auto-Fallback: Free Unlimited Phone/Browser Natural Voice!
            speakWithBrowserTTS(segments, preferTaglish, myRunId);
        }

        function buildSpokenSegmentsForCard(scriptObj) {
            const segments = [];
            if (scriptObj && scriptObj.stem) segments.push(scriptObj.stem);

            // Shuffle-Safe: ALWAYS include ALL Choices (A, B, C, D) in their exact current shuffled display order!
            const shuffledOpts = state.currentShuffledChoices ? state.currentShuffledChoices.options : null;
            if (shuffledOpts && shuffledOpts.length > 0) {
                shuffledOpts.forEach(opt => {
                    const spokenChoice = (scriptObj && scriptObj.choices && scriptObj.choices[opt.origLetter])
                        ? scriptObj.choices[opt.origLetter]
                        : localCleanForTTS(opt.text);
                    segments.push(`Choice ${opt.displayLetter}. ${spokenChoice}`);
                });
            }
            return segments;
        }

        async function copyTextToClipboardSafe(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) { return false; }
        }
